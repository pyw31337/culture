name: Publish LetsHub observability
on:
  schedule: [{cron: '20 18 * * *'}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/record_observability.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/observability/latest.json
          git diff --staged --quiet || (git commit -m "chore(ops): publish culture observability [skip ci]" && git push origin main)
