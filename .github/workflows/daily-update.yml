name: Daily Data Update

on:
  schedule:
    - cron: '0 18 * * *' # 03:00 KST fallback. Local launchd owns the 00:00 KST primary update.
  workflow_dispatch:

concurrency:
  group: daily-data-update
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: write
    outputs:
      data_changed: ${{ steps.commit_changes.outputs.data_changed || 'false' }}
      deployed_sha: ${{ steps.commit_changes.outputs.deployed_sha || '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check local update freshness
        id: freshness
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const outputPath = process.env.GITHUB_OUTPUT;
          const eventName = process.env.GITHUB_EVENT_NAME || '';
          const buildInfoPath = path.join(process.cwd(), 'public', 'data', 'build-info.json');
          const writeOutput = (key, value) => fs.appendFileSync(outputPath, `${key}=${value}\n`);
          const kstDate = (date) => new Intl.DateTimeFormat('en-CA', {
            timeZone: 'Asia/Seoul',
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
          }).format(date);

          if (eventName === 'workflow_dispatch') {
            writeOutput('should_run', 'true');
            writeOutput('skip_reason', 'manual-dispatch');
            console.log('Manual dispatch: running fallback update regardless of freshness.');
            process.exit(0);
          }

          let generatedAt = null;
          try {
            generatedAt = JSON.parse(fs.readFileSync(buildInfoPath, 'utf8')).generatedAt || null;
          } catch (error) {
            writeOutput('should_run', 'true');
            writeOutput('skip_reason', 'missing-build-info');
            console.log('No readable build-info.json; running fallback update.');
            process.exit(0);
          }

          const generatedDate = generatedAt ? new Date(generatedAt) : null;
          const now = new Date();
          const ageHours = generatedDate ? (now.getTime() - generatedDate.getTime()) / 36e5 : Infinity;
          const freshToday = generatedDate && kstDate(generatedDate) === kstDate(now) && ageHours >= 0 && ageHours <= 20;

          if (freshToday) {
            writeOutput('should_run', 'false');
            writeOutput('skip_reason', 'local-update-already-fresh');
            console.log(`Skipping fallback: local data is fresh. generatedAt=${generatedAt}, ageHours=${ageHours.toFixed(2)}`);
          } else {
            writeOutput('should_run', 'true');
            writeOutput('skip_reason', 'fallback-needed');
            console.log(`Running fallback: generatedAt=${generatedAt || 'none'}, ageHours=${Number.isFinite(ageHours) ? ageHours.toFixed(2) : 'unknown'}`);
          }
          NODE

      - name: Skip summary
        if: steps.freshness.outputs.should_run == 'false'
        run: |
          echo "Local midnight update already refreshed data today. GitHub fallback skipped."
          echo "Reason: ${{ steps.freshness.outputs.skip_reason }}"

      - name: Setup Node.js
        if: steps.freshness.outputs.should_run == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache Playwright Chromium
        if: steps.freshness.outputs.should_run == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        if: steps.freshness.outputs.should_run == 'true'
        run: |
          export PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
          npm ci --prefer-offline --no-audit --fund=false

      - name: Install Playwright Chromium
        if: steps.freshness.outputs.should_run == 'true'
        run: |
          # --with-deps already installs required Linux browser dependencies.
          npx playwright install chromium --with-deps

      - name: Run Scrapers
        if: steps.freshness.outputs.should_run == 'true'
        timeout-minutes: 55
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          # GitHub-hosted runners use rotating Azure IPs. Kakao REST API is
          # restricted by allowed IP, so only the local Mac mini job may call it.
          DISABLE_KAKAO_API: '1'
          NAVER_SEARCH_CLIENT_ID: ${{ secrets.NAVER_SEARCH_CLIENT_ID }}
          NAVER_SEARCH_CLIENT_SECRET: ${{ secrets.NAVER_SEARCH_CLIENT_SECRET }}
          # GitHub Actions is only the 03:00 KST fallback. Keep it shallow, but
          # still enrich the nearest Interpark items so visible cards do not lose
          # price, age, and runtime when the local midnight job is stale.
          INTERPARK_ENRICH_LIMIT: '80'
          INTERPARK_FAST_MODE: '1'
          INTERPARK_CONCURRENCY: '2'
          INTERPARK_NAVIGATION_TIMEOUT_MS: '25000'
          INTERPARK_SELECTOR_TIMEOUT_MS: '12000'
          INTERPARK_POST_LOAD_DELAY_MS: '1500'
          INTERPARK_PROTOCOL_TIMEOUT_MS: '45000'
          # KOPIS checkpoints and exits cleanly before the outer timeout. The
          # local midnight run still performs the unrestricted deep refresh.
          KOPIS_DETAIL_LIMIT: '80'
          KOPIS_VENUE_LIMIT: '40'
          KOPIS_RUN_BUDGET_SECONDS: '420'
          KOPIS_LOOKBACK_DAYS: '45'
          KOPIS_REQUEST_RETRIES: '2'
          KOPIS_REQUEST_TIMEOUT_MS: '10000'
          YES24_DETAIL_LIMIT: '100'
          UMCLASS_DETAIL_LIMIT: '80'
          MOCHACLASS_MAX_PAGES: '28'
          MOCHACLASS_DETAIL_LIMIT: '24'
          MOCHACLASS_CONCURRENCY: '3'
          MOCHACLASS_DETAIL_TIMEOUT_MS: '12000'
          MOCHACLASS_SELECTOR_TIMEOUT_MS: '6000'
          MOCHACLASS_POST_LOAD_DELAY_MS: '250'
          MOCHACLASS_RETAIN_UNSEEN_EXISTING: '1'
          MUSEUM_MAX_DETAIL_ITEMS: '160'
          MUSEUM_DETAIL_BUDGET_MS: '180000'
          CULTURE_PORTAL_MAX_API_PAGES: '360'
          CULTURE_PORTAL_DETAIL_LIMIT: '180'
          TOURISM_MAX_PAGES: '25'
          TOURISM_PUPPETEER_TIMEOUT_MS: '12000'
          SEOUL_CULTURE_SKIP_DETAIL: '1'
          KBL_MONTH_LOOKAHEAD: '4'
          UMCLASS_MAX_PAGES: '24'
          UMCLASS_MISSING_GEO_CRITICAL_THRESHOLD: '1000'
          VENUE_PLACE_LOOKUP_LIMIT: '0'
          VENUE_PLACE_LOOKUP_DELAY_MS: '250'
          SCRAPER_CRITICAL_TIMEOUT_SECONDS: '480'
          SCRAPER_OPTIONAL_TIMEOUT_SECONDS: '240'
          SCRAPER_RETRY_COUNT: '1'
          SCRAPER_OPTIONAL_RETRY_COUNT: '0'
          SCRAPER_OPTIONAL_BUDGET_SECONDS: '1200'
        run: |
          set +e
          SCRAPER_CRITICAL_TIMEOUT_SECONDS="${SCRAPER_CRITICAL_TIMEOUT_SECONDS:-480}"
          SCRAPER_OPTIONAL_TIMEOUT_SECONDS="${SCRAPER_OPTIONAL_TIMEOUT_SECONDS:-240}"
          SCRAPER_RETRY_COUNT="${SCRAPER_RETRY_COUNT:-1}"
          SCRAPER_OPTIONAL_RETRY_COUNT="${SCRAPER_OPTIONAL_RETRY_COUNT:-0}"
          SCRAPER_OPTIONAL_BUDGET_SECONDS="${SCRAPER_OPTIONAL_BUDGET_SECONDS:-1200}"
          SCRAPER_STARTED_AT="$(date +%s)"
          SCRAPER_CHECKPOINT_ROOT="$RUNNER_TEMP/cultureflow-scraper-checkpoints"
          mkdir -p "$SCRAPER_CHECKPOINT_ROOT"
          export PUPPETEER_EXECUTABLE_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          echo "Puppeteer executable: ${PUPPETEER_EXECUTABLE_PATH}"
          failures=()
          recovered_failures=()

          elapsed_seconds() {
            echo $(( $(date +%s) - SCRAPER_STARTED_AT ))
          }

          run_scraper() {
            local name="$1"
            local priority="$2"
            shift 2

            local elapsed timeout_seconds retry_count checkpoint_dir attempt status
            elapsed="$(elapsed_seconds)"
            if [ "$priority" = "optional" ] && [ "$elapsed" -ge "$SCRAPER_OPTIONAL_BUDGET_SECONDS" ]; then
              echo "Skipping optional scraper ${name}: elapsed ${elapsed}s exceeds fallback budget ${SCRAPER_OPTIONAL_BUDGET_SECONDS}s"
              return 0
            fi

            if [ "$priority" = "critical" ]; then
              timeout_seconds="$SCRAPER_CRITICAL_TIMEOUT_SECONDS"
              retry_count="$SCRAPER_RETRY_COUNT"
            else
              timeout_seconds="$SCRAPER_OPTIONAL_TIMEOUT_SECONDS"
              retry_count="$SCRAPER_OPTIONAL_RETRY_COUNT"
            fi

            checkpoint_dir="$SCRAPER_CHECKPOINT_ROOT/$name"
            rm -rf "$checkpoint_dir"
            mkdir -p "$checkpoint_dir"
            cp -a src/data "$checkpoint_dir/data"

            echo "::group::${name}"
            echo "Elapsed before ${name}: ${elapsed}s"
            status=1
            for attempt in $(seq 1 $((retry_count + 1))); do
              echo "Attempt ${attempt}/$((retry_count + 1)); timeout=${timeout_seconds}s"
              # Browser scrapers may leave Chromium children alive after TERM.
              # Escalate after 15s so one source cannot consume the whole job.
              timeout --preserve-status --kill-after=15s "${timeout_seconds}" "$@"
              status=$?
              if [ $status -eq 0 ]; then
                break
              fi

              echo "${name} attempt ${attempt} failed with exit=${status}; restoring its data checkpoint."
              rm -rf src/data
              cp -a "$checkpoint_dir/data" src/data

              if [ "$attempt" -le "$retry_count" ]; then
                if [ "$priority" = "optional" ] && [ "$(elapsed_seconds)" -ge "$SCRAPER_OPTIONAL_BUDGET_SECONDS" ]; then
                  echo "Not retrying optional scraper ${name}: fallback budget reached."
                  break
                fi
                sleep $((attempt * 3))
              fi
            done
            echo "::endgroup::"

            if [ $status -eq 124 ] || [ $status -eq 137 ] || [ $status -eq 143 ]; then
              echo "${name} timed out or was terminated after ${timeout_seconds}s"
            fi

            if [ $status -ne 0 ]; then
              failures+=("$name")
            elif [ "$attempt" -gt 1 ]; then
              recovered_failures+=("$name")
            fi

            rm -rf "$checkpoint_dir"
          }

          while IFS=$'\t' read -r name priority command; do
            run_scraper "$name" "$priority" bash -lc "$command"
          done < <(node scripts/print-scraper-plan.mjs github)

          : > scrape_failures.txt
          if [ ${#failures[@]} -gt 0 ]; then
            printf '%s\n' "${failures[@]}" > scrape_failures.txt
            echo "SCRAPER_FAILURES=true" >> $GITHUB_ENV
            echo "Scraper failures detected. Continuing with existing retained data; validation steps decide whether this fallback is publishable:"
            cat scrape_failures.txt
          fi

          if [ ${#recovered_failures[@]} -gt 0 ]; then
            printf '%s\n' "${recovered_failures[@]}" > scrape_recovered_failures.txt
            echo "SCRAPER_RECOVERED_FAILURES=true" >> $GITHUB_ENV
            echo "Scrapers recovered after retry:"
            cat scrape_recovered_failures.txt
          fi

          exit 0

      - name: Scraper Failure Summary
        if: steps.freshness.outputs.should_run == 'true' && env.SCRAPER_FAILURES == 'true'
        run: |
          {
            echo "### Scraper warnings"
            echo ""
            echo "Some scrapers failed during the GitHub fallback pass, but this is not treated as a workflow failure by itself."
            echo "The fallback continues with retained data and only fails if generation or validation fails."
            echo ""
            echo "Failed scrapers:"
            sed 's/^/- /' scrape_failures.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Scraper Recovery Summary
        if: steps.freshness.outputs.should_run == 'true' && env.SCRAPER_RECOVERED_FAILURES == 'true'
        run: |
          {
            echo "### Scrapers recovered after retry"
            echo ""
            sed 's/^/- /' scrape_recovered_failures.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate Data Integrity (Pre-Commit Check)
        if: steps.freshness.outputs.should_run == 'true'
        env:
          UMCLASS_MISSING_GEO_CRITICAL_THRESHOLD: '1000'
        run: npx tsx scripts/validate-data-integrity.ts

      - name: Prune Stale Data (Strict Retention)
        if: steps.freshness.outputs.should_run == 'true'
        run: |
          npx tsx scripts/prune-expired-data.ts
          npx tsx scripts/prune-data.ts

      - name: Generate Public Data Artifacts
        if: steps.freshness.outputs.should_run == 'true'
        run: npm run generate-data

      - name: Stabilize Poster Image Cache
        if: steps.freshness.outputs.should_run == 'true'
        env:
          POSTER_CACHE_MAX_NEW_DOWNLOADS: '2500'
          POSTER_CACHE_INCLUDE_ALL_REMOTE: '1'
          POSTER_CACHE_CONCURRENCY: '6'
        run: |
          npm run cache:posters
          npm run generate:thumbs

      - name: Validate Content Quality
        if: steps.freshness.outputs.should_run == 'true'
        run: npm run validate:content

      - name: Validate Detail Completeness
        if: steps.freshness.outputs.should_run == 'true'
        run: npm run validate:details

      - name: Validate Location Integrity
        if: steps.freshness.outputs.should_run == 'true'
        run: npm run validate:locations

      - name: Validate Display Integrity
        if: steps.freshness.outputs.should_run == 'true'
        run: npm run validate:display

      - name: Commit and Push changes
        if: steps.freshness.outputs.should_run == 'true'
        id: commit_changes
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add src/data
          git add public/data
          git add public/version.txt
          git add public/images/posters
          git add public/images/thumbs

          if git diff --quiet && git diff --staged --quiet; then
            echo "data_changed=false" >> "$GITHUB_OUTPUT"
            echo "deployed_sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore: fallback daily data update"
          git push || {
            git pull --rebase --autostash origin main
            git push
          }

          echo "data_changed=true" >> "$GITHUB_OUTPUT"
          echo "deployed_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log Error to Tracker
        if: failure() && steps.freshness.outputs.should_run == 'true'
        run: |
          echo "### 🚨 CI Action Runtime Failure" >> ERROR_TRACKER.md
          echo "- **Date**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> ERROR_TRACKER.md
          echo "- **GitHub Run ID**: [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> ERROR_TRACKER.md
          echo "- **Note**: The 03:00 KST fallback data update failed after the local midnight update was absent or stale." >> ERROR_TRACKER.md
          if [ -f scrape_failures.txt ] && [ -s scrape_failures.txt ]; then
            echo "- **Failed Scrapers**:" >> ERROR_TRACKER.md
            sed 's/^/  - /' scrape_failures.txt >> ERROR_TRACKER.md
          fi
          echo "" >> ERROR_TRACKER.md

      - name: Commit Error Tracker
        if: failure() && steps.freshness.outputs.should_run == 'true'
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add ERROR_TRACKER.md
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "chore: Log CI failure to ERROR_TRACKER [skip ci]" &&
            (git push || {
              git pull --rebase --autostash origin main
              git push
            })
          )

  deploy-updated-data:
    needs: update-data
    if: needs.update-data.outputs.data_changed == 'true' && needs.update-data.outputs.deployed_sha != ''
    uses: ./.github/workflows/deploy.yml
    with:
      checkout-sha: ${{ needs.update-data.outputs.deployed_sha }}
      prebuilt-data: true
    secrets: inherit
