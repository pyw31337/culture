name: Daily Data Update

on:
  schedule:
    - cron: '0 18 * * *' # 03:00 KST fallback. Local launchd owns the 00:00 KST primary update.
  workflow_dispatch:

concurrency:
  group: daily-data-update
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: write
    outputs:
      data_changed: ${{ steps.commit_changes.outputs.data_changed || 'false' }}
      deployed_sha: ${{ steps.commit_changes.outputs.deployed_sha || '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check local update freshness
        id: freshness
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const outputPath = process.env.GITHUB_OUTPUT;
          const eventName = process.env.GITHUB_EVENT_NAME || '';
          const buildInfoPath = path.join(process.cwd(), 'public', 'data', 'build-info.json');
          const writeOutput = (key, value) => fs.appendFileSync(outputPath, `${key}=${value}\n`);
          const kstDate = (date) => new Intl.DateTimeFormat('en-CA', {
            timeZone: 'Asia/Seoul',
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
          }).format(date);

          if (eventName === 'workflow_dispatch') {
            writeOutput('should_run', 'true');
            writeOutput('skip_reason', 'manual-dispatch');
            console.log('Manual dispatch: running fallback update regardless of freshness.');
            process.exit(0);
          }

          let generatedAt = null;
          try {
            generatedAt = JSON.parse(fs.readFileSync(buildInfoPath, 'utf8')).generatedAt || null;
          } catch (error) {
            writeOutput('should_run', 'true');
            writeOutput('skip_reason', 'missing-build-info');
            console.log('No readable build-info.json; running fallback update.');
            process.exit(0);
          }

          const generatedDate = generatedAt ? new Date(generatedAt) : null;
          const now = new Date();
          const ageHours = generatedDate ? (now.getTime() - generatedDate.getTime()) / 36e5 : Infinity;
          const freshToday = generatedDate && kstDate(generatedDate) === kstDate(now) && ageHours >= 0 && ageHours <= 20;

          if (freshToday) {
            writeOutput('should_run', 'false');
            writeOutput('skip_reason', 'local-update-already-fresh');
            console.log(`Skipping fallback: local data is fresh. generatedAt=${generatedAt}, ageHours=${ageHours.toFixed(2)}`);
          } else {
            writeOutput('should_run', 'true');
            writeOutput('skip_reason', 'fallback-needed');
            console.log(`Running fallback: generatedAt=${generatedAt || 'none'}, ageHours=${Number.isFinite(ageHours) ? ageHours.toFixed(2) : 'unknown'}`);
          }
          NODE

      - name: Skip summary
        if: steps.freshness.outputs.should_run == 'false'
        run: |
          echo "Local midnight update already refreshed data today. GitHub fallback skipped."
          echo "Reason: ${{ steps.freshness.outputs.skip_reason }}"

      - name: Setup Node.js
        if: steps.freshness.outputs.should_run == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache Playwright Chromium
        if: steps.freshness.outputs.should_run == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        if: steps.freshness.outputs.should_run == 'true'
        run: |
          export PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
          npm ci --prefer-offline --no-audit --fund=false

      - name: Install Playwright Chromium
        if: steps.freshness.outputs.should_run == 'true'
        run: |
          # --with-deps already installs required Linux browser dependencies.
          npx playwright install chromium --with-deps

      - name: Run Scrapers
        if: steps.freshness.outputs.should_run == 'true'
        timeout-minutes: 55
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          # GitHub-hosted runners use rotating Azure IPs. Kakao REST API is
          # restricted by allowed IP, so only the local Mac mini job may call it.
          DISABLE_KAKAO_API: '1'
          NAVER_SEARCH_CLIENT_ID: ${{ secrets.NAVER_SEARCH_CLIENT_ID }}
          NAVER_SEARCH_CLIENT_SECRET: ${{ secrets.NAVER_SEARCH_CLIENT_SECRET }}
          # GitHub Actions is only the 03:00 KST fallback. Keep it shallow so it
          # finishes within the free-minute budget; the local midnight job does
          # the deeper enrichment pass.
          INTERPARK_ENRICH_LIMIT: '160'
          YES24_DETAIL_LIMIT: '100'
          UMCLASS_DETAIL_LIMIT: '140'
          MOCHACLASS_MAX_PAGES: '60'
          MOCHACLASS_DETAIL_LIMIT: '90'
          MOCHACLASS_CONCURRENCY: '4'
          MOCHACLASS_DETAIL_TIMEOUT_MS: '18000'
          MOCHACLASS_SELECTOR_TIMEOUT_MS: '6000'
          MOCHACLASS_POST_LOAD_DELAY_MS: '450'
          MOCHACLASS_RETAIN_UNSEEN_EXISTING: '1'
          MUSEUM_MAX_DETAIL_ITEMS: '160'
          CULTURE_PORTAL_MAX_API_PAGES: '360'
          CULTURE_PORTAL_DETAIL_LIMIT: '180'
          TOURISM_MAX_PAGES: '25'
          VENUE_PLACE_LOOKUP_LIMIT: '0'
          VENUE_PLACE_LOOKUP_DELAY_MS: '250'
          SCRAPER_TIMEOUT_SECONDS: '600'
          SCRAPER_OPTIONAL_BUDGET_SECONDS: '2400'
        run: |
          set +e
          SCRAPER_TIMEOUT_SECONDS="${SCRAPER_TIMEOUT_SECONDS:-900}"
          SCRAPER_OPTIONAL_BUDGET_SECONDS="${SCRAPER_OPTIONAL_BUDGET_SECONDS:-2400}"
          SCRAPER_STARTED_AT="$(date +%s)"
          export PUPPETEER_EXECUTABLE_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          echo "Puppeteer executable: ${PUPPETEER_EXECUTABLE_PATH}"
          failures=()
          critical_failures=()

          elapsed_seconds() {
            echo $(( $(date +%s) - SCRAPER_STARTED_AT ))
          }

          run_scraper() {
            local name="$1"
            local priority="$2"
            shift 2

            local elapsed
            elapsed="$(elapsed_seconds)"
            if [ "$priority" = "optional" ] && [ "$elapsed" -ge "$SCRAPER_OPTIONAL_BUDGET_SECONDS" ]; then
              echo "Skipping optional scraper ${name}: elapsed ${elapsed}s exceeds fallback budget ${SCRAPER_OPTIONAL_BUDGET_SECONDS}s"
              return 0
            fi

            echo "::group::${name}"
            echo "Elapsed before ${name}: ${elapsed}s"
            timeout --preserve-status "${SCRAPER_TIMEOUT_SECONDS}" "$@"
            local status=$?
            echo "::endgroup::"

            if [ $status -eq 124 ] || [ $status -eq 137 ] || [ $status -eq 143 ]; then
              echo "${name} timed out or was terminated after ${SCRAPER_TIMEOUT_SECONDS}s"
            fi

            if [ $status -ne 0 ]; then
              failures+=("$name")
              if [ "$priority" = "critical" ]; then
                critical_failures+=("$name")
              fi
            fi
          }

          # Core fallback pass: keep these early so a near-timeout run still
          # reaches venue/public artifact generation with useful updates.
          run_scraper "interpark" critical npx tsx scripts/scrape-interpark.ts
          run_scraper "festival" optional npx tsx scripts/scrape-festival.ts
          run_scraper "kbo" critical npx tsx scripts/scrape-kbo.ts
          run_scraper "kleague" optional npx tsx scripts/scrape-kleague.ts
          run_scraper "yes24-exclusive" optional npx tsx scripts/scrape-yes24-exclusive.ts
          run_scraper "kopis" critical npx tsx scripts/scrape-kopis.ts
          run_scraper "timeticket" optional npx tsx scripts/scrape-timeticket.ts
          run_scraper "movies" critical npx tsx scripts/scrape-movies.ts
          run_scraper "cinemas" critical npx tsx scripts/scrape-cinemas.ts
          run_scraper "build-venues" critical npx tsx scripts/build-venues.ts

          # Extended pass: these are valuable, but the local midnight job is the
          # canonical deep refresh. GitHub fallback skips them once the budget is
          # spent instead of burning the full monthly Actions allowance.
          run_scraper "kovo" optional npx tsx scripts/scrape-kovo.ts
          run_scraper "kbl" optional npx tsx scripts/scrape-kbl.ts
          run_scraper "handball" optional npx tsx scripts/scrape-handball.ts
          run_scraper "myrealtrip" optional node scripts/scrape-myrealtrip.js
          run_scraper "umclass" optional npx tsx scripts/scrape-umclass.ts
          run_scraper "sssd" optional npx tsx scripts/scrape-sssd.ts
          run_scraper "mochaclass" optional npx tsx scripts/scrape-mochaclass.ts
          run_scraper "museum" optional npx tsx scripts/scrape-museum.ts
          run_scraper "mommom" optional npx tsx scripts/scrape-mommom.ts
          run_scraper "mommom-activities" optional npx tsx scripts/scrape-mommom-activities.ts
          run_scraper "mommom-exhibitions" optional npx tsx scripts/scrape-mommom-exhibitions.ts
          run_scraper "mommom-products" optional npx tsx scripts/scrape-mommom-products.ts
          run_scraper "seoul-culture" optional npx tsx scripts/scrape-seoul-culture.ts
          run_scraper "culture-portal" optional npx tsx scripts/scrape-culture-portal.ts
          run_scraper "tourism" optional npx tsx scripts/scrape-visitkorea-expanded.ts
          run_scraper "venue-places" optional npx tsx scripts/enrich-venue-places.ts

          : > scrape_failures.txt
          if [ ${#failures[@]} -gt 0 ]; then
            printf '%s\n' "${failures[@]}" > scrape_failures.txt
            echo "SCRAPER_FAILURES=true" >> $GITHUB_ENV
            echo "Scraper failures detected:"
            cat scrape_failures.txt
          fi

          if [ ${#critical_failures[@]} -gt 0 ]; then
            echo "Critical scraper failures detected. Aborting before validation and commit so partial critical data is not published:"
            printf '%s\n' "${critical_failures[@]}"
            exit 1
          fi

          exit 0

      - name: Validate Data Integrity (Pre-Commit Check)
        if: steps.freshness.outputs.should_run == 'true'
        run: npx tsx scripts/validate-data-integrity.ts

      - name: Prune Stale Data (Strict Retention)
        if: steps.freshness.outputs.should_run == 'true'
        run: |
          npx tsx scripts/prune-expired-data.ts
          npx tsx scripts/prune-data.ts

      - name: Generate Public Data Artifacts
        if: steps.freshness.outputs.should_run == 'true'
        run: npm run generate-data

      - name: Validate Content Quality
        if: steps.freshness.outputs.should_run == 'true'
        run: npm run validate:content

      - name: Validate Location Integrity
        if: steps.freshness.outputs.should_run == 'true'
        run: npm run validate:locations

      - name: Validate Display Integrity
        if: steps.freshness.outputs.should_run == 'true'
        run: npm run validate:display

      - name: Commit and Push changes
        if: steps.freshness.outputs.should_run == 'true'
        id: commit_changes
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add src/data
          git add public/data
          git add public/version.txt
          git add public/images/posters

          if git diff --quiet && git diff --staged --quiet; then
            echo "data_changed=false" >> "$GITHUB_OUTPUT"
            echo "deployed_sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore: fallback daily data update"
          git push || {
            git pull --rebase --autostash origin main
            git push
          }

          echo "data_changed=true" >> "$GITHUB_OUTPUT"
          echo "deployed_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log Error to Tracker
        if: failure() && steps.freshness.outputs.should_run == 'true'
        run: |
          echo "### 🚨 CI Action Runtime Failure" >> ERROR_TRACKER.md
          echo "- **Date**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> ERROR_TRACKER.md
          echo "- **GitHub Run ID**: [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> ERROR_TRACKER.md
          echo "- **Note**: The 03:00 KST fallback data update failed after the local midnight update was absent or stale." >> ERROR_TRACKER.md
          if [ -f scrape_failures.txt ] && [ -s scrape_failures.txt ]; then
            echo "- **Failed Scrapers**:" >> ERROR_TRACKER.md
            sed 's/^/  - /' scrape_failures.txt >> ERROR_TRACKER.md
          fi
          echo "" >> ERROR_TRACKER.md

      - name: Commit Error Tracker
        if: failure() && steps.freshness.outputs.should_run == 'true'
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add ERROR_TRACKER.md
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "chore: Log CI failure to ERROR_TRACKER [skip ci]" &&
            (git push || {
              git pull --rebase --autostash origin main
              git push
            })
          )
