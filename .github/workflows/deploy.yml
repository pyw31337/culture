name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Trigger on push to main (UI/Code changes)
  workflow_dispatch:
  workflow_call: # Allow calling from other workflows (like daily-update)
    inputs:
      checkout-sha:
        required: false
        type: string
      prebuilt-data:
        required: false
        type: boolean
        default: false
    secrets:
      NEXT_PUBLIC_KAKAO_JS_KEY:
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: deploy-to-github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout-sha != '' && inputs.checkout-sha || github.sha }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-nextjs-

      - name: Install dependencies
        run: |
          export PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
          npm ci --prefer-offline --no-audit --fund=false

      - name: Validate Prebuilt Data Artifacts
        if: ${{ inputs.prebuilt-data == true }}
        run: |
          npm run validate:content
          npm run validate:locations

      - name: Build Website
        env:
          NEXT_PUBLIC_BASE_PATH: /culture
          NEXT_PUBLIC_KAKAO_JS_KEY: ${{ secrets.NEXT_PUBLIC_KAKAO_JS_KEY }}
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: |
          if [ "${{ inputs.prebuilt-data }}" = "true" ]; then
            npm run build:site
          else
            npm run build
          fi

      - name: Verify Static Artifacts
        run: |
          test -f out/data/performances.json
          test -f out/data/build-info.json
          test -f out/images/og-image.jpg
          test -f out/version.txt
          test -f out/robots.txt
          test -f out/sitemap.xml
          grep -q "dapi.kakao.com/v2/maps/sdk.js" out/map/index.html

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
