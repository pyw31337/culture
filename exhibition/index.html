이 그를 이끌었다. 일본미술학교에서 수학하며 극장일, 목공, 구두닦이 등 아르바이트하여 학비를 충당하였고, 일부는 마산에 계신 아버지에게 보내 현재 미술관 부지를 매입하도록 한다. 1945년 해방과 함께 귀국한 문신은 마산, 부산, 서울 등지에서 전시를 개최한다. \u003c어부\u003e(1946), \u003c고추\u003e(1946), \u003c고기잡이\u003e(1948), \u003c뒷산과 하늘\u003e(1948) 등 자신이 거주하고 있는 환경과 그 환경에서 생산되는 사물을 자신만의 색채와 형태로 대담하게 표현하는데, 서울 동화화랑에서 \u003c제1회 문신 양화 개인전\u003e(1948)에서 평론가 길진섭은 문신의 작품에서 ‘감득(感得)할 수 있는 솔직한 소박성’이 나타나며, ‘낡은 사상과 양식의 허의(虛儀)를 버린 작가’라 높이 평하기도 한다. 1950년 한국 전쟁이 발발했을 때는 종군 화가로도 활동하며 \u003c야전병원\u003e(1952)을 통해 전쟁의 현장을 기록한다. 이후에는 활동무대를 서울로 옮겨 이규상, 한묵, 유영국, 박고석, 천경자 등과 더불어 \u003c모던아트협회\u003e 참여하는데, 이 그룹은 국전과 한국화단에 전위의식을 가진 30, 40대의 중견작가들이 결성된 그룹으로 모던아트의 기치를 내걸고 자신의 창작 이념을 바탕으로 예술의 순수성과 독자성을 내세운다. 문신은 이 시기에 추상으로 전환하는데 \u003c암소\u003e(1957), \u003c정물\u003e(1959), \u003c태평로에서\u003e(1959) 등에서 표현주의와 입체주의가 추구했던 조형적 실험을 엿 볼 수 있다. 1961년 문신의 나이 39세에 프랑스로 향한다. 20시기 초 예술의 중심지였던 프랑스 파리는 다양성을 수용하고 인정하는 자유로운 분위기였으며, 엥포르멜, 타시즘, 신사실주의 등 추상주의적 경향이 지배적이었다. 문신은 1961년부터 1980년까지(1965-1967 일시귀국) 프랑스에서 생활한다. 1960년대는 문신의 새로운 예술이 열리는 시기로 재료, 형상 등에 대한 다양한 실험을 통해 추상의 세계에 몰두한다. 이러한 시도는 \u003c사랑\u003e(1962), \u003c무제\u003e(1964), 조각과 공간의 경계를 넘나드는 \u003c인간이 살 수 있는 조각\u003e(1966-1967)에서도 나타난다. 1967년 문신은 갤러리스트 존 크라븐이 커미셔너로 활동한 《국제 조각 심포"])</script><script>self.__next_f.push([1,"19:T1331,"])</script><script>self.__next_f.push([1,"문화예술공공수장고는 2025 야외 전시 프로젝트 《강주현: 연결의 비정형》展을 선보인다. 자연과 예술이 공존하는 지리적 특성을 지닌 공공수장고는 그동안 지역의 문화 정체성과 생태 환경을 반영한 다양한 콘텐츠를 개발해 왔다. 이번 기획은 우리가 일상 속에서 무심코 지나쳤던 주변 유휴공간에 새로운 시선을 부여하고, 다양한 매체의 대입을 통해 공간을 새롭게 해석하고, 재구성하고자 한다. 나아가 예술이 특정한 틀이나 경계 안에 머무르지 않고, 자연·공간과·관객의 다층적 관계 속에서 어떻게 확장되고 진화할 수 있는지 탐색하고자 한다. 이번《연결의 비정형》展은 기능적 공간의 고정된 역할을 넘어, 수장고가 지닌 장소성과 공공성에 대해 근본적인 질문을 던지고, 그 의미를 새롭게 해석하고자 하는 시도를 담고 있다. 단순히 작품을 보관하는 폐쇄된 장소가 아니라, 예술과 사람, 감각과 사유가 유기적으로 소통하는 ‘열림의 공간’으로 전환하려는 의지를 담은 것이다. 작가는 이 전시를 통해 공공수장고의 기존 개념을 재구성하며, 공간 자체가 하나의 살아 있는 예술적 장(場)이 될 수 있음을 제안한다. 작가의 시선은 수장고를 단지 물리적 공간이 아닌, 시간과 관계, 감각이 머무르고 흘러가는 역동적인 구조로 바라본다. 즉, 이곳은 이제 더 이상 예술품이 정적으로 ‘머무는’ 장소가 아니라, 관객의 참여와 인식을 통해 끊임없이 ‘생성’되고 ‘변형’되는 열린 장소로 변모된다. 전시 \",\"awayTeam\":\"$undefined\",\"homeTeamLogo\":\"$undefined\",\"awayTeamLogo\":\"$undefined\",\"backupPoster\":\"http://www.culture.go.kr/upload/ucms/oneCltInfo/2026/202602/3f348feb75854fac80a0e4aa4846765a.jpg\",\"posterUrl\":\"$undefined\",\"category\":\"$undefined\",\"rank\":\"$undefined\",\"dateRaw\":\"$undefined\",\"lat\":33.33966276456556,\"lng\":126.26558503039344,\"address\":\"제주특별자치도 제주시 한경면 저지14길 35\",\"source\":\"culture-portal\",\"website\":\"$undefined\",\"parking\":\"$undefined\",\"parkingFee\":\"$undefined\",\"facilities\":\"\",\"restrooms\":\"$undefined\",\"performanceTime\":\"화-일 09:15-17:30 / 월요일 휴관\",\"bookingNotice\":\"$undefined\",\"ageDetail\":\"$undefined\",\"feesAndPrograms\":\"\",\"targetAudience\":\"\",\"operatingHours\":\"\",\"priceDetail\":\"\",\"closedDays\":\"\",\"contact\":\"제주현대미술관 064-710-7801\",\"synopsis\":\"$undefined\",\"trailer\":\"$undefined\",\"roi\":\"$undefined\",\"reservationRate\":\"$undefined\",\"audienceCount\":\"$undefined\",\"budget\":\"$undefined\",\"revenue\":\"$undefined\",\"budgetKRW\":\"$undefined\",\"revenueKRW\":\"$undefined\"},{\"id\":\"perf_80년_함께_걸어온_기억의_순간\",\"title\":\"80년, 함께 걸어온 기억의 순간\",\"date\":\"2025.09.30 (화) ~ 2026.06.28 (일)\",\"venue\":\"충남 | 국립부여박물관\",\"image\":\"http://www.culture.go.kr/upload/rdf/25/09/show_2025092910304022600.jpg\",\"link\":\"https://www.mcst.go.kr/kor/s_culture/culture/cultureView.jsp?pSeq=59444\",\"region\":\"unknown\",\"genre\":\"exhibition\",\"description\":\"국립부여박물관은 개관 80주년을 기념하여 특별전 \u003c80년, 함께 걸어온 기억의 순간\u003e을 개최합니다. 국립부여박물관은 1945년 10월 13일 국립박물관 부여분관으로 개관하였고, 1971년 부소산의 부여 객사 뒤편에 건물을 신축하여 재개관하였으며, 1993년 8월 6일 금성산이 있는 현재의 위치로 이전하였습니다. 이번 특별전은 국립부여박물관의 역사를 일제강점기, 부소산 1기, 부소산 2기, 금성산 시기로 나누고 주요 내용을 체계적으로 전시하여 박물관이 걸어온 길을 시간의 흐름에 따라 이해하고 공감할 수 있도록 구성하였습니다. 1부 일제강점기는 재단법인 부여고적보존회, 조선총독부박물관 부여분관이 남긴 자료를 전시하여 당시의 부여에 대한 인식과 전시의 성격을 살펴보았습니다. 2부 부소산 1기는 홍사준 초대 관장과 직원들이 소장품 확보, 전시, 학술조사 등 여러 분야에서 박물관의 기틀을 닦기 위해 노력했던 이야기를 담았습니다. 3부 부소산 2기는 부소산 신관 건립 이후 활발해진 전시와 학술조사 활동을 소개하였으며, 당시의 상설전시를 재현한 키오스크 영상으로 이해를 도왔습니다. 오랜만에 부여에 돌아온 부여 송국리 유적 출토 요령식 동검과 청동 도끼 거푸집이 반갑게 관람객을 맞이합니다. 4부 금성산 시기는 백제금동대향로의 발굴·보존·전시 기록을 일목요연하게 정리하였고, 다양한 특별전을 개최하며 백제전문박물관으로 성장해 온 박물관의 모습을 살펴봅니다. 5부 내 삶 속의 박물관은 박물관과 인연을 맺은 사람들의 이야기를 담아, ‘박물관과 나’ 인터뷰 영상, ‘사진을 찾습니다’ 이벤트에 응모한 사진으로 꾸미는 참여형 전시로 구성하여 80주년의 의미를 더하였습니다. 개관 80주년을 기념하여 마련한 이번 특별전을 관람하면서 국립부여박물관 80년의 발자취를 추억하며, 새로운 80년을 함께해 주시기 바랍니다. 해당 공연·전시 프로그램은 주최자·공연자 등의 사정에 따라 변경될 수 있습니다. 1688-2220\",\"discount\":\"$undefined\",\"originalPrice\":\"$undefined\",\"price\":\"무료\",\"gradeIcon\":\"$undefined\",\"ageRating\":\"\",\"subGenre\":\"$undefined\",\"runningTime\":\"$undefined\",\"originalTitle\":\"$undefined\",\"productionCountry\":\"$undefined\",\"productionYear\":\"$undefined\",\"cast\":[],\"director\":\"$undefined\",\"movieInfo\":\"$undefined\",\"homeTeam\":\"$undefined\",\"awayTeam\":\"$undefined\",\"homeTeamLogo\":\"$undefined\",\"awayTeamLogo\":\"$undefined\",\"backupPoster\":\"http://www.culture.go.kr/upload/rdf/25/09/show_2025092910304022600.jpg\",\"posterUrl\":\"$undefined\",\"category\":\"$undefined\",\"rank\":\"$undefined\",\"dateRaw\":\"$undefined\",\"lat\":36.2765515,\"lng\":126.91678849999994,\"address\":\"충청남도 부여군 부여읍 금성로 5\",\"source\":\"culture-portal\",\"website\":\"$undefined\",\"parking\":\"$undefined\",\"parkingFee\":\"$undefined\",\"facilities\":\"\",\"restrooms\":\"$undefined\",\"performanceTime\":\"화-일 09:00-18:00 / 월요일 휴관\",\"bookingNotice\":\"$undefined\",\"ageDetail\":\"$undefined\",\"feesAndPrograms\":\"\",\"targetAudience\":\"\",\"operatingHours\":\"\",\"priceDetail\":\"\",\"closedDays\":\"\",\"contact\":\"041-833-8562\",\"synopsis\":\"$undefined\",\"trailer\":\"$undefined\",\"roi\":\"$undefined\",\"reservationRate\":\"$undefined\",\"audienceCount\":\"$undefined\",\"budget\":\"$undefined\",\"revenue\":\"$undefined\",\"budgetKRW\":\"$undefined\",\"revenueKRW\":\"$undefined\"},{\"id\":\"perf_공감_천안_격세지감\",\"title\":\"공감 천안: 격세지감\",\"date\":\"2025.09.30 (화) ~ 2026.05.31 (일)\",\"venue\":\"충남 | 천안박물관\ o.kr/upload/rdf/25/09/rdf_2025091721221710441.jpg\",\"link\":\"https://www.mcst.go.kr/kor/s_culture/culture/cultureView.jsp?pSeq=58981\",\"region\":\"unknown\",\"genre\":\"exhibition\",\"description\":\"소장품은 한 시대의 예술과 역사의 흐름을 알 수 있는 미술관의 중요한 자산이다. 수집한 소장품을 공개하고 공유하는 것은 동시대 미술관의 중요한 역할이며 본질적인 기능과 깊게 연관된다. 미술관의 기원으로 여겨지는 16세기 유럽의 ‘호기심의 방’은 진귀하고 이국적인 수집품을 전시함으로써 보는 사람에게 새로운 경험과 지적 탐구를 제공한 공간이다. 근대 국민국가의 형성과 함께 공공성이 확대되며 개인의 소유물이었던 미술품이 대중에게 개방되고 점차 현대적인 뮤지엄으로 발전하였다. 이번 전시는 ‘호기심의 방’처럼 새로운 경험과 지적인 탐구를 할 수 있도록 국립현대미술관이 수집한 국제미술 소장품 중 엄선한 40여 점의 작품을 소개하는 상설 전시다. 특히 지난 2021년 이건희컬렉션 수증을 통해 미술관에 소장된 19세기 유럽의 미술뿐만 아니라 현대미술의 경계를 넓힌 다양한 해외 미술 작품을 살펴볼 수 있다. 전시의 제목으로 사용한 ‘수련과 샹들리에’라는 상호 이질적인 단어는 19세기 인상주의를 대표하는 빛의 화가 클로드 모네의 작품 ？수련이 있는 연못？(1917-1920)과 동시대 활발히 활동하는 세계적인 예술가 아이 웨이웨이의 작품 ？검은 샹들리에？(2017-2021)의 제목을 조합한 것이다. 자연을 의미하는 ‘수련’과 인공적 사물 ‘샹들리에’ 사이에 ‘-과(와)’라는 접속조사를 사용하여 시대와 경계를 넘어 또 다른 연결의 가능성을 만들어 나간다는 의미를 담았다. 두 작품이 제작된 100년이라는 시간 사이에 놓인 다양한 해외 미술의 장면들에 귀 기울이고 그 관계성을 상상해 나가다 보면 어느새 호기심 가득한 새로운 경험의 시간에 닿을 것이다. 해당 공연·전시 프로그램은 주최자·공연자 등의 사정에 따라 변경될 수 있습니다. 1688-2220\",\"discount\":\"$undefined\",\"originalPrice\":\"$undefined\",\"price\":\"과천 전시관람권 3,000원\",\"gradeIcon\":\"$undefined\",\"ageRating\":\"\",\"subGenre\":\"$undefined\",\"runningTime\":\"$undefined\",\"originalTitle\":\"$undefined\",\"productionCountry\":\"$undefined\",\"productionYear\":\"$undefined\",\"cast\":[],\"director\":\"$undefined\",\"movieInfo\":\"$undefined\",\"homeTeam\":\"$undefined\",\"awayTeam\":\"$undefined\",\"homeTeamLogo\":\"$undefined\",\"awayTeamLogo\":\"$undefined\",\"backupPoster\":\"http://www.culture.go.kr/upload/rdf/25/09/rdf_2025091721221710441.jpg\",\"posterUrl\":\"$undefined\",\"category\":\"$undefined\",\"rank\":\"$undefined\",\"dateRaw\":\"$undefined\",\"lat\":37.4312896582898,\"lng\":127.020079902514,\"address\":\"경기도 과천시 광명로 313\",\"source\":\"culture-portal\",\"website\":\"$undefined\",\"parking\":\"$undefined\",\"parkingFee\":\"$undefined\",\"facilities\":\"\",\"restrooms\":\"$undefi .888937271598,\"address\":\"서울특별시 구로구 경인로 662\",\"source\":\"culture-portal\",\"website\":\"$undefined\",\"parking\":\"$undefined\",\"parkingFee\":\"$undefined\",\"facilities\":\"\",\"restrooms\":\"$undefined\",\"performanceTime\":\"월요일 ~ 화요일(20:30), 목요일 ~ 금요일(20:30), 토요일 ~ 일요일(19:30)\",\"bookingNotice\":\"$undefined\",\"ageDetail\":\"$undefined\",\"feesAndPrograms\":\"\",\"targetAudience\":\"\",\"operatingHours\":\"\",\"priceDetail\":\"\",\"closedDays\":\"\",\"contact\":\"1544-8855\",\"synopsis\":\"$undefined\",\"trailer\":\"$undefined\",\"roi\":\"$undefined\",\"reservationRate\":\"$undefined\",\"audienceCount\":\"$undefined\",\"budget\":\"$undefined\",\"revenue\":\"$undefined\",\"budgetKRW\":\"$undefined\",\"revenueKRW\":\"$undefined\"},{\"id\":\"perf_AI_기반_미디어아트_전시_뉴_미디어의_재해_석\",\"title\":\"AI 기반 미디어아트 전시 《뉴-미디어의 재해-석》\",\"date\":\"2025.10.28 (화) ~ 2026.07.04 (토)\",\"venue\":\"서울 | 중랑아트센터\",\"image\":\"http://www.culture.go.kr/upload/rdf/25/10/show_2025103110154346566.jpg\",\"link\":\"https://www.mcst.go.kr/kor/s_culture/culture/cultureView.jsp?pSeq=60792\",\"region\":\"unknown\",\"genre\":\"exhibition\",\"description\":\"《뉴-미디어의 재해-석》 오늘날 ‘인공지능(AI)’은 단순한 도구를 넘어 일상뿐만 아니라 예술을 재편하는 매개로 작동한다. 멀티모달 처리, 상호작용성, 딥러닝 등의 기술은 감각의 방식을 바꾸고, 창작과 수용의 구조를 근본적으로 흔들고 있다. 예술은 더 이상 고정된 결과물이 아니라, AI가 만든 새로운 조건 속에서 다시 작동하기 시작한다. 1960년대 미디어 이론가 마셜 맥루한은 “미디어는 메시지다”라는 주장으로, 미디어를 인간 감각과 사회 구조를 새롭게 구성하는 환경으로 보았다. 라디오와 전화, 인터넷을 거쳐 오늘날의 AI는 이 논리를 가장 첨예하게 드러내는 새로운 미디어로 등장했다. 전시 《뉴-미디어의 재해-석》은 바로 이 지점을 탐구한다. 여기서 ‘재해(災害)’는 기존 질서에 대한 균열과 충격을, ‘재해석(再解釋)’은 그 틈에서 발견되는 새로운 가능성(환경)을 의미한다. 이번 전시는 네 점의 작품을 통해 이러한 전환의 장면을 드러낸다. 《뉴 월드? II》는 NFT의 실시간 데이터를 파도의 이미지로 시각화하며 기술의 비가시적 흐름과 환경적 함의를 드러낸다. 《일렉트릭 드림》은 AI 이미지와 관람객의 상호작용을 통해 기억과 정체성의 경계를 탐색한다. 《루덴스토피아》는 현실 공간과 유희 공간을 AI가 재해석해 제3의 상상 공간으로 재구성한다. 《모든 것이 연결되어 있다》는 생태계와 역사 데이터를 통해 기술과 자연, 인간의 관계를 재사유한다. 이 환경에서 작가는 결론을 제시하는 존재가 아니라 질문의 조건을 설계하는 존재로 바뀌고, 관람자는 그 질문에 반응하며 새로운 감각적 주체로 자리한다. 《뉴-미디어의 재해-석》은 이러한 감각과 해석의 변화를 점검하며, 오늘날 예술이 새롭게 작동하는 방식을 탐구한다. 해당 공연 음 시작되었습니다. 깨진 토기 조각, 부러진 금동불상 조각을 붙이기 위해 이쑤시개 하나로 이물질을 제거하고 접착제를 바르던 열악한 환경에서 출발했지만, 이제는 재질과 제작기법 그리고 현재 상태를 과학적으로 진단, 가장 적절한 보존 방식을 찾아가는 전문 분야로 발전했습니다. 지금의 보존과학은 디지털과 인공지능(AI)이라는 새로운 기술과 맞닿아 있습니다. 지난 50여 년간 쌓아 온 보존 처리 기술과 3D 스캔, 고해상도 이미지와 분석 자료 등을 디지털 자료로 전환하고 인공지능을 접목해 박물관 보존과학의 새로운 미래를 열어 나가고자 합니다. 보존과학은 단지 옛 인류의 유산을 ‘오래’ 남기는 데 그치지 않고 그 속에 담긴 삶의 흔적과 지혜를 밝혀 미래 세대로 이어 가는 과학입니다. 과거와 현재 그리고 미래 세대를 위해 우리 문화유산을 지켜 내는 길, 그 중심에 국립중앙박물관 보존과학이 있습니다. 해당 공연·전시 프로그램은 주최자·공연자 등의 사정에 따라 변경될 수 있습니다. 1688-2220\",\"discount\":\"$undefined\",\"originalPrice\":\"$undefined\",\"price\":\"무료\",\"gradeIcon\":\"$undefined\",\"ageRating\":\"\",\"subGenre\":\"$undefined\",\"runningTime\":\"$undefined\",\"originalTitle\":\"$undefined\",\"productionCountry\":\"$undefined\",\"productionYear\":\"$undefined\",\"cast\":[],\"director\":\"$undefined\",\"movieInfo\":\"$undefined\",\"homeTeam\":\"$undefined\",\"awayTeam\":\"$undefined\",\"homeTeamLogo\":\"$undefined\",\"awayTeamLogo\":\"$undefined\",\"backupPoster\":\"http://www.culture.go.kr/upload/rdf/25/11/show_202511191436306944.png\",\"posterUrl\":\"$undefined\",\"category\":\"$undefined\",\"rank\":\"$undefined\",\"dateRaw\":\"$undefined\",\"lat\":37.52470233,\"lng\":126.9777412,\"address\":\"서울특별시 용산구 서빙고로 137\",\"source\":\"culture-portal\",\"website\":\"$undefined\",\"parking\":\"$undefined\",\"parkingFee\":\"$undefined\",\"facilities\":\"\",\"restrooms\":\"$undefined\",\"performanceTime\":\"10:00-17:30 / 휴관일 1월 1일, 설날, 주말 및 공휴일\",\"bookingNotice\":\"$undefined\",\"ageDetail\":\"$undefined\",\"feesAndPrograms\":\"\",\"targetAudience\":\"\",\"operatingHours\":\"\",\"priceDetail\":\"\",\"closedDays\":\"\",\"contact\":\"국립중앙박물관 02-2077-9000\",\"synopsis\":\"$undefined\",\"trailer\":\"$undefined\",\"roi\":\"$undefined\",\"reservationRate\":\"$undefined\",\"audienceCount\":\"$undefined\",\"budget\":\"$undefined\",\"revenue\":\"$undefined\",\"budgetKRW\":\"$undefined\",\"revenueKRW\":\"$undefined\"},{\"id\":\"perf_2025년_특별기획전_경산에서_타오른_의병의_불꽃_임진왜란 lture/cultureView.jsp?pSeq=63323\",\"region\":\"unknown\",\"genre\":\"exhibition\",\"description\":\"“제가 집착하고 있는 면이 있다면 자연 속의 생명체 그것에 대한 사랑일 것입니다. 자연 속 생명체의 사랑은 영원한 것이어서 이 지구가 없어지는 그날까지 지속될 것으로 알고 있습니다. ” - 문 신 - 이번 전시는 문신미술관에 소장된 작가 문신의 대표적인 작품을 ‘사랑’이란 주제로 살펴보는 전시입니다. 문신(Moon shin, 1922-1995)은 오랜 타국 생활의 고독함과 치열한 창작활동, 벅찬 일상에서도 늘 ‘사랑’의 감정을 잃지 않았습니다. 그는 자연 속 생명체에 대한 사랑에 늘 집착해 왔으며 작품에서 사랑의 감정을 느낄 수 없다면 그것은 한낱 장식품에 불과하다고 말했습니다. 항상 묵묵하게 창작하고 마음을 잘 드러내지 않는 과묵한 성격이었지만 예술을 향한 문신의 뜨거운 열정과 깊은 사랑은 평생 변함이 없었습니다. 문신이 가진 사랑의 감정은 고향 마산, 고국, 아버지와 주변인들, 평화, 자연과 생명, 우주로까지 확장되어 나갔으며 그의 예술의 원동력이자 주제가 되었습니다. 문신미술관에 소장된 그의 작품은 그가 사랑했던 고향의 자연을 바라보며 우주를 향하여 언제나 빛나고 있습니다. 문신이 느꼈던 사랑의 감정을 함께 느끼며 그의 작품을 사랑의 시선으로 바라보는 의미 있는 시간이 되길 바랍니다. 해당 공연·전시 프로그램은 주최자·공연자 등의 사정에 따라 변경될 수 있습니다. 1688-2220\",\"discount\":\"$undefined\",\"originalPrice\":\"$undefined\",\"price\":\"어른 500원 / 어린이 200원 / 청소년, 군인, 대학생 200원 / 예술인 200원\",\"gradeIcon\":\"$undefined\",\"ageRating\":\"\",\"subGenre\":\"$undefined\",\"runningTime\":\"$undefined\",\"originalTitle\":\"$undefined\",\"productionCountry\":\"$undefined\",\"productionYear\":\"$undefined\",\"cast\":[],\"director\":\"$undefined\",\"movieInfo\":\"$undefined\",\"homeTeam\":\"$undefined\",\"awayTeam\":\"$undefined\",\"homeTeamLogo\":\"$undefined\",\"awayTeamLogo\":\"$undefined\",\"backupPoster\":\"http://www.culture.go.kr/upload/rdf/25/12/show_202512171016759559.jpg\",\"posterUrl\":\"$undefined\",\"category\":\"$undefined\",\"rank\":\"$undefined\",\"dateRaw\":\"$undefined\",\"lat\":35.2063153567667,\"lng\":128.568983145071,\"address\":\"경상남도 창원시 마산합포구 문신길 147\",\"source\":\"culture-portal\",\"website\":\"$undefined\",\"parking\":\"$undefined\",\"parkingFee\":\"$undefined\",\"facilities\":\"\",\"restrooms\":\"$undefined\",\"performanceTime\":\"09:00 ~18:00 *매주 월 휴관\",\"bookingNotice\":\"$undefined\",\"ageDetail\":\"$undefined\",\"feesAndPrograms\":\"\",\"targetAudience\":\"\",\"operatingHours\":\"\",\"priceDetail\":\"\",\"closedDays\":\"\",\"contact\":\"055-225-7181\",\"synopsis\":\"$undefined\",\"trailer\":\"$undefined\",\"roi\":\"$undefined\",\"reservationRate\":\"$undefined\",\"audienceCount\":\"$undefined\",\"budget\":\"$undefined\",\"revenue\":\"$undefined\",\"budgetKRW\":\"$undefined\",\"revenueKRW\":\"$undefined\"},{\"id\":\"perf_제16회_기획전시_여성_삶을_이끌다_사랑_헌신_전\",\"title\":\"제16회 기획전시 『여성, 삶을 이끌다!: 사랑 \u0026 헌신』 전(展)\",\"date\":\"2025.12.16 (화) ~ 2026.06.07 (일)\",\"venue\":\"충북 | 반기문평화기념관\",\"image\":\"http://www.culture.go.kr/upload/rdf/25/12/rdf_202512292122912491.jpg\",\"link\":\"https://www.mcst.go.kr/kor/s_culture/culture/cultureView.jsp?pSeq=63866\",\"region\":\"unknown\",\"genre\":\"exhibition\",\"description\":\"제8대 유엔 사무총장 반기문 평화기념관에서는 열여섯 번째 기획전시 『 여성, 삶을 이끌다 : 사랑 \u0026 헌신』전(展)을 마련하였습니다. 반기문 전(前) 총장께서 유엔 사무총장으로 재임하던 기간(2007~2016) 동안 각국 정상과 단체로부터 받으신 여성을 주제로 한 회화, 조각품 등 소장품 30여 점을 소개합니다. 이 소장품들은 총장님의 여성 인권 증진 노력에 대한 국제사회의 깊은 공감과 감사의 마음이 담겨 있습니다. 이번 전시는 세계 여성들의 평범한 일상과 염원을 담은 작품들을 소개합니다. 가족에 대한 사랑과 헌신으로 역경을 이겨내고 스스로와 세상을 이끄는 그들의 강인하고 아름다운 삶을 조명합니다. 이와 함께, 여성 인권 향상과 성평등에 앞장서 왔던 반기문 전 유엔 사무총장의 활동과 업적을 소개합니다. 반기문 전 사무총장은 재임 기간 동안 \\\"여성의 권리 보장 없이는 지속 가능한 발전과 평화가 불가능하다\\\"고 역설하며, 특히 여성의 교육과 경제활동 참여를 적극적으로 지지하고 여성 폭력 근절을 위한 국제적 협력을 주도했습니다. 유엔을 비롯한 국제기구와 민간단체들이 여성 인권 신장과 성차별 해소를 위해 다방면으로 노력하고 있지만, 성차별은 우리 사회에 여전히 복합적인 형태로 존재합니다. 지구촌의 많은 여성들은 딸, 아내, 어머니로서 사회적 책임을 묵묵히 감내하며, 열정과 희망을 잃지 않고 스스로와 공동체의 삶을 지켜내고 있습니다. 이번 전시는 거창한 담론보다는, 묵묵히 일상을 살아가는 여성들의 순간들을 포착하여 새로운 시각과 깊은 공감대를 형성하고자 합니다. 그들의 헌신적인 사랑과 열정이 어떻게 삶을 이끌어 왔고, 인류의 더 나은 미래를 만들어 왔는지, 그 위대하고 찬란한 삶의 여정에 함께하시기를 바랍니다. 해당 공연·전시 프로그램은 주최자·공연자 등의 사정에 따라 변경될 수 있습니다. 1688-2220\",\"discount\":\"$undefined\",\"originalPrice\":\"$undefined\",\"price\":\"무료\",\"gradeIcon\":\"$undefined\",\"ageRating\":\"\",\"subGenre\":\"$undefined\",\"runningTime\":\"$undefined\",\"originalTitle\":\"$undefined\",\"productionCountry\":\"$undefined\",\"productionYear\":\"$undefined\",\"cast\":[],\"director\":\"$undefined\",\"movieInfo\":\"$undefined\",\"homeTeam\":\"$undefined\",\"awayTeam\":\"$undef 의 지평이 본격적으로 확장·전환되는 시기를 주목하며, 1910년대부터 1945년 해방 이전, 해방 이후부터 1958년 프랑스 이주 이전까지, 그리고 프랑스 체류 시기의 세 단계로 구성된다. 조국의 독립을 향한 열망이 담긴 대나무 그림에서 출발해, 분단과 통일, 나아가 세계평화의 문제를 고민한 \u003c군상\u003e 연작에 이르기까지, 이번 전시에 소개되는 이응노의 작품은 시대의 변화 속에서 그의 예술이 양식과 주제를 확장해 온 과정을 보여준다. 이응노의 작품세계는 동서양 양식의 경계를 넘나들며, 글로벌 현대미술의 장 속에서 예술과 사회의 관계를 끊임없이 사유하는 방향으로 나아갔다. 그는 예술적 실험을 넘어 민족과 이념, 경계를 초월한 인간 공동체와 평화에 대한 질문을 지속적으로 던지며, 현대미술이 사회와 맺을 수 있는 실천적 가능성을 제시한다. 해당 공연·전시 프로그램은 주최자·공연자 등의 사정에 따라 변경될 수 있습니다. 1688-2220\",\"discount\":\"$undefined\",\"originalPrice\":\"$undefined\",\"price\":\"성인 1,000원 / 청소년, 어린이 600원\",\"gradeIcon\":\"$undefined\",\"ageRating\":\"\",\"subGenre\":\"$undefined\",\"runningTime\":\"$undefined\",\"originalTitle\":\"$undefined\",\"productionCountry\":\"$undefined\",\"productionYear\":\"$undefined\",\"cast\":[],\"director\":\"$undefined\",\"movieInfo\":\"$undefined\",\"homeTeam\":\"$undefined\",\"awayTeam\":\"$undefined\",\"homeTeamLogo\":\"$undefined\",\"awayTeamLogo\":\"$undefined\",\"backupPoster\":\"http://www.culture.go.kr/upload/ucms/oneCltInfo/2026/202601/e2a43c3526364478bfef1005b53b7bba.jpg\",\"posterUrl\":\"$undefined\",\"category\":\"$undefined\",\"rank\":\"$undefined\",\"dateRaw\":\"$undefined\",\"lat\":36.3668520183625,\"lng\":127.38704342053482,\"address\":\"대전광역시 서구 둔산대로 157\",\"source\":\"culture-portal\",\"website\":\"$undefined\",\"parking\":\"$undefined\",\"parkingFee\":\"$undefined\",\"facilities\":\"\",\"restrooms\":\"$undefined\",\"performanceTime\":\"3-10월 10:00-19:00 / 11-2월 10:00-18:00 / 매주 월요일 휴관\",\"bookingNotice\":\"$undefined\",\"ageDetail\":\"$undefined\",\"feesAndPrograms\":\"\",\"targetAudience\":\"\",\"operatingHours\":\"\",\"priceDetail\":\"\",\"closedDays\":\"\",\"contact\":\"이응노미술관 042-611-9800\",\"synopsis\":\"$undefined\",\"trailer\":\"$undefined\",\"roi\":\"$undefined\",\"reservationRate\":\"$undefined\",\"audienceCount\":\"$undefined\",\"budget\":\"$undefined\",\"revenue\":\"$undefined\",\"budgetKRW\":\"$undefined\",\"revenueKRW\":\"$undefined\" 아\",\"image\":\"http://www.culture.go.kr/upload/rdf/26/02/show_2026021121194444113.jpg\",\"link\":\"https://www.mcst.go.kr/kor/s_culture/culture/cultureView.jsp?pSeq=65549\",\"region\":\"unknown\",\"genre\":\"exhibition\",\"description\":\"유선태 초대전 'My Garden, My Artelier' 1월 28일(수)~3월 7일(토) II 관 : 갤러리가이아 부산 T. 051-627-3373 (부산시 남구 대연동 16 2F) 관람시간 : 화~토 11am~4pm(공휴일 예약관람) 3월 17일(수)~5월 30일(토) I 관 : 갤러리가이아 서울 T. 02-733-3373 (서울시 강남구 청담동 80-5 1F) 관람시간 : 화~토 11am~6pm(공휴일 예약관람) \u003c작가 소개 및 작품 설명\u003e 유선태 작가님은 홍익대학교와 동대학원, 파리국립미술대학교에서 수학한 후 파리8대학에서 박사 학위를 받은 후에 서울, 파리, 뉴욕, 벨기에, 스페인 등에서 다수의 개인전을 개최했습니다. 아크릴이라는 서양화의 재료에 동양화의 준법을 활용한 서정적 초현실주의로 주목을 받고있습니다. 입체와 평면을 넘나들며 작업하는 작가는 자신의 작품을 '오브제의 숲'이라고 표현할만큼 많은 일상의 친숙한 사물들로 안과 밖, 현실과 환상을 초월한 공간 안에서 신비로운 화면을 연출합니다. 유선태 작가의 그림에는 사물들을 낯선 관계 속에 놓는 '데페이스망(dépaysement)' 즉, 일상의 오브제들을 그 쓰임과 다르게 그려내거나 배치함으로써 보는 이로 하여금 낯설게 느껴지도록 하는 기법이 활용되었습니다. 작가는 초현실적인 3차원의 공간에 다양한 오브제들을 재구성함으로써 새로운 인식의 전환과 즐거운 상상을 가능하게 합니다. 각각의 사물을 정의하는 단어는 하나로 부족하다고 말하는 작가는 자신의 작업을 통해 다양한 의미를 부여하고 신비로운 가상세계를 그림을 통해 구현하고 있습니다. 해당 공연·전시 프로그램은 주최자·공연자 등의 사정에 따라 변경될 수 있습니다. 1688-2220\",\"discount\":\"$undefined\",\"originalPrice\":\"$undefined\",\"price\":\"무료\",\"gradeIcon\":\"$undefined\",\"ageRating\":\"\",\"subGenre\":\"$undefined\",\"runningTime\":\"$undefined\",\"originalTitle\":\"$undefined\",\"productionCountry\":\"$undefined\",\"productionYear\":\"$undefined\",\"cast\":[],\"director\":\"$undefined\",\"movieInfo\":\"$undefined\",\"homeTeam\":\"$undefined\",\"awayTeam\":\"$undefined\",\"homeTeamLogo\":\"$undefined\",\"awayTeamLogo\":\"$undefined\",\"backupPoster\":\"http://www.culture.go.kr/upload/rdf/26/02/show_2026021121194444113.jpg\",\"posterUrl\":\"$undefined\",\"category\":\"$undefined\",\"rank\":\"$undefined\",\"dateRaw\":\"$undefined\",\"lat\":37.5263594410216,\"lng\":127.04409783944173,\"address\":\"서울특별시 강남구 선릉로162길 43\",\"source\":\"culture-portal\",\"website\":\"$undefined\",\"parking\":\"$undefined\",\"parkingFee\":\"$undefined\",\"facilities\":\"\",\"restrooms\":\"$undefined\",\"performanceTime\":\"-\",\"bookingNotice\":\"$undefined\",\"ageDetail\":\"$undefined\",\"feesAndPrograms\":\"\",\"targetAudience\":\"\",\"operatingHours\":\"\",\"priceDetail\":\"\",\"closedDays\":\"\",\"contact\":\"02-733-3373\",\"synopsis\":\"$undefined\",\"trailer\":\"$undefined\",\"roi\":\"$undefined\",\"reservationRate\":\"$undefined\",\"audienceCount\":\"$undefined\",\"budget\":\"$undefined\",\"revenue\":\"$undefined\",\"budgetKRW\":\"$undefined\",\"revenueKRW\":\"$undefined\"},{\"id\":\"perf_소멸의_시학_삭는_미술에_대하여\",\"title\":\"소멸의 시학: 삭는 미술에 대하여\",\"date\":\"2026.01.30 (금) ~ 2026.05.03 (일)\",\"venue\":\"서울 | 국립현대미술관 서울관\",\"image\":\"http://www.culture.go.kr/upload/rdf/25/11/rdf_2025113021384317280.jpg\",\"link\":\"https://www.mcst.go.kr/kor/s_culture/culture/cultureView.jsp?pSeq=62350\",\"region\":\"unknown\",\"genre\":\"exhibition\",\"description\":\"뛰어난 작품을 불후의 명작이라고 부른다. 이때 불후(不朽)는 썩지 아니함이라는 뜻을 갖고 있다. 훌륭한 작품이란 곧 변하지 않을 혹은 변해서는 안 될 작품이라면, 굳이 변하고 사라질 작품을 만드는 이유는 무엇일까? «소멸의 시학: 삭는 미술에 대하여»는 언젠가 썩어갈 운명을 시인하는 작품, 차라리 무엇도 남기지 않기로 마음먹은 작품, 자신의 분해를 공연히 상연하는 작품을 '삭는 미술'이라는 이름으로 묶어 소개한다. 오늘날 폭발적으로 분출한 인간중심주의에 대한 비판과 첨단의 자본주의, 기술만능주의에 대한 반발과 함께 변화하고 있는 작품의 양상을 살펴보고, 그로부터 당면한 위기를 헤쳐갈 지혜를 구하기 위해서다. '삭다'라는 우리말에는 '썩은 것처럼 되다', '생기를 잃다'와 더불어 '소화되다', '발효되어 맛이 들다'라는 의미가 담겨 있다. 이 단어는 오늘날 작품의 변화를 해석하는 데 유효한 통로를 제공한다. 썩는다는 표현에 담긴 부정적 함의를 넘어 에너지의 하강과 상승을 모두 포괄하고, 발효와 같이 인간이 아닌 존재와 협력하여 이루는 질적 고양을 떠올리게 한다는 점에서다. 창조하는 인간의 증거로서 '작품'이 삭아갈 때 무슨 일이 일어날까? '작품'이 허물어진 곳에 풀이 자라고 바람이 불고 보이지 않는 생명이 움직이기 시작한다면 그것을 다시 '작품'이라고 불러도 될까? 그때 그 '작품'은 누구의 것일까? 불후의 명작들의 수장고로서 미술관은 위대한 작품들의 가치를 변함없이 지키는 데 헌신해왔다. 삭는 미술은 묻는다. 인간을 넘어 다양한 존재와 함께 살아가기 위해 자신을 삭히기로 마음먹은 작품을 받아들일 준비가 되어 있느냐고. 수상한 계절이 이어지는 오늘, 더 잘 보존하기보다 더 잘 분해하는 법을 고민해야 할 때임을 인정할 수 있겠냐고. 해당 공연·전시 프로그램은 주최자·공연자 등의 사정에 따라 변경될 수 있습니다. 1688-2220\",\"discount\":\"$undefined\",\"originalPrice\":\"$undefined\",\"price\":\"미정 [홈페이지 참고]\",\"gradeIcon\":\"$undefined\",\"ageRating\":\"\",\"subGenre\":\"$undefined\",\"runningTime  석고 원형은 색이나 재료적 요소가 배제된 순수한 백색의 형태로, 우리는 작가가 생각한 최초의 형상을 마주하게 됩니다. 이 순수하고 절제된 아름다움 속에서 그의 창작 과정에 대한 깊은 통찰을 얻을 수 있으며, 그가 추구한 형상의 이면에 존재하는 사유의 깊이를 감각적으로 따라갈 수 있습니다. 석고의 표면 위로 흐르는 선과 면의 리듬과 볼륨, 그리고 빛과 그림자가 만들어내는 미묘한 긴장은 작품이 지닌 생명력을 더욱 선명하게 드러냅니다. 이처럼 석고 원형은 하나의 완결된 형상이자 동시에 무한한 변주가 가능한 창작의 출발점으로서, 문신 조각이 지닌 생동감 있는 조형적 에너지의 원천이라 할 수 있습니다. 한편, 석고 원형은 재료적 특성상 시간과 환경에 많은 영향을 받기에 지속적인 보존 관리가 요구됩니다. 본 전시에서 문신의 석고 원형을 보존 처리한 사례를 함께 소개하며, 작품이 창작된 이후에 어떻게 관리되고 그 의미가 이어지는지를 살펴보고자 합니다. 이 과정은 예술 작품의 보존이 어떻게 시간과 기억을 현재와 미래로 이어가는지 생각하게 합니다. 《The Origin》은 문신의 창작 과정에서 석고 원형이 지닌 의미를 재조명하며, 그의 예술 세계를 깊은 마음으로 바라보고자 합니다. 해당 공연·전시 프로그램은 주최자·공연자 등의 사정에 따라 변경될 수 있습니다. 1688-2220\",\"discount\":\"$undefined\",\"originalPrice\":\"$undefined\",\"price\":\"성인 500원 / 어린이, 청소년, 군인, 대학생, 예술인 200원\",\"gradeIcon\":\"$undefined\",\"ageRating\":\"\",\"subGenre\":\"$undefined\",\"runningTime\":\"$undefined\",\"originalTitle\":\"$undefined\",\"productionCountry\":\"$undefined\",\"productionYear\":\"$undefined\",\"cast\":[],\"director\":\"$undefined\",\"movieInfo\":\"$undefined\",\"homeTeam\":\"$undefined\",\"awayTeam\":\"$undefined\",\"homeTeamLogo\":\"$undefined\",\"awayTeamLogo\":\"$undefined\",\"backupPoster\":\"http://www.culture.go.kr/upload/ucms/oneCltInfo/2026/202602/9dc0ebebba77409db374a441ef712e85.png\",\"posterUrl\":\"$undefined\",\"category\":\"$undefined\",\"rank\":\"$undefined\",\"dateRaw\":\"$undefined\",\"lat\":35.2063153567667,\"lng\":128.568983145071,\"address\":\"경상남도 창원시 마산합포구 문신길 147\",\"source\":\"culture-portal\",\"website\":\"$undefined\",\"parking\":\"$undefined\",\"parkingFee\":\"$undefined\",\"facilities\":\"\",\"restrooms\":\"$undefined\",\"performanceTime\":\"화-일 09:00-18:00 / 월요일 휴관\",\"bookingNotice\":\"$undefined\",\"ageDetail\":\"$undefined\",\"feesAndPrograms\":\"\",\"targetAudience\":\"\",\"operatingHours\":\"\",\"priceDetail\":\"\",\"closedDays\":\"\",\"contact\":\"창원시립마산문신미술관 055-225-7181\",\"synopsis\":\"$undefined\",\"trailer\":\"$undefined\",\"roi\":\"$undefined\",\" s_culture/culture/cultureView.jsp?pSeq=66022\",\"region\":\"unknown\",\"genre\":\"exhibition\",\"description\":\"《깊고 깊은 숲으로: 도로시의 원더링》은 17세기 말 세일럼 마녀 재판*에서 출발한다. 이 사건으로 어머니를 잃은 네 살 소녀 도로시 굿(Dorothy Good)의 이후를 상상하며, 기록되지 않은 시간과 감각을 불러온다. 깊은 숲속에서 다양한 존재와 만나는 도로시의 여정은 현실과 환상의 경계를 흐리며 전개된다. 전시 제목의 ‘원더링’은 목적 없는 방황이 아닌, 상실 이후 세계를 인식하고 관계 맺으며 스스로를 재구성해 나가는 과정으로 제시된다. 이번 전시는 작가 스텔라 수진이 그림을 그리는 행위를 통해 무엇을 바라보고 남기고자 하는지 질문한다. 이를 통해 작품 속에 축적된 작가의 시선과 사유의 흐름을 마주하게 한다. * 세일럼 마녀 재판(1692–1693): 미국 메사추세츠 세일럼에서 일어난 마녀 재판으로 갈등과 편견이 뒤엉킨 사회 속에서 무고한 사람들을 희생시킨 사건. 해당 공연·전시 프로그램은 주최자·공연자 등의 사정에 따라 변경될 수 있습니다. 1688-2220\",\"discount\":\"$undefined\",\"originalPrice\":\"$undefined\",\"price\":\"무료\",\"gradeIcon\":\"$undefined\",\"ageRating\":\"\",\"subGenre\":\"$undefined\",\"runningTime\":\"$undefined\",\"originalTitle\":\"$undefined\",\"productionCountry\":\"$undefined\",\"productionYear\":\"$undefined\",\"cast\":[],\"director\":\"$undefined\",\"movieInfo\":\"$undefined\",\"homeTeam\":\"$undefined\",\"awayTeam\":\"$undefined\",\"homeTeamLogo\":\"$undefined\",\"awayTeamLogo\":\"$undefined\",\"backupPoster\":\"http://www.culture.go.kr/upload/ucms/oneCltInfo/2026/202602/bf042f9df7a342e99cd74328cdab9b7f.jpg\",\"posterUrl\":\"$undefined\",\"category\":\"$undefined\",\"rank\":\"$undefined\",\"dateRaw\":\"$undefined\",\"lat\":36.3668725417191,\"lng\":127.385713083518,\"address\":\"대전광역시 서구 둔산대로 155\",\"source\":\"culture-portal\",\"website\":\"$undefined\",\"parking\":\"$undefined\",\"parkingFee\":\"$undefined\",\"facilities\":\"\",\"restrooms\":\"$undefined\",\"performanceTime\":\"10:00 ~ 19:00 (매월 마지막 수요일 21:00 까지) *관람시간 종료 30분전까지\",\"bookingNotice\":\"$undefined\",\"ageDetail\":\"$undefined\",\"feesAndPrograms\":\"\",\"targetAudience\":\"\",\"operatingHours\":\"\",\"priceDetail\":\"\",\"closedDays\":\"\",\"contact\":\"042-120\",\"synopsis\":\"$undefined\",\"trailer\":\"$undefined\",\"roi\":\"$undefined\",\"reservationRate\":\"$undefined\",\"audienceCount\":\"$undefined\",\"budget\":\"$undefined\",\"revenue\":\"$undefined\",\"budgetKRW\":\"$undefined\",\"revenueKRW\":\"$undefined\"},{\"id\":\"perf_열린수장고_상설전_DMA_소장품_하이라이트_2026\",\"title\":\"열린수장고 상설전 《DMA 소장품 하이라이트 2026》\",\"date\":\"2026.03.03 (화) ~ 2026.12.13 (일)\",\"venue\":\"대전 | 대전시립미술관\",\"image\":\"http://www.culture.go.kr/upload/ucms/oneCltInfo/2026/202602/ad18cf0a637e4b059ec687208c53b8a9.jpg\",\"link\":\"https://www.mcst.go.kr/kor/s_culture/culture/cultureView.jsp?pSeq=66023\",\"region\":\"unknown\",\"genre\":\"exhibition\",\"description\":\"설치작품은 공간을 작품의 일부로 사용하는만큼 자유로운 설치형태와 압도적인 스케일로 전시공간 전체를 점유하며 관람객과 상호작용하는 특성을 갖는다. 그러나 전시가 종료된 이후에는 필연적으로 해체 과정을 거치며, 최대한 압축된 형태로 보관된다. 이 때 작품의 안전한 운송과 보관을 위해 사용되는 미술작품 전용 보관함을 ‘크레이트(Crate)’라고 한다. 크레이트는 단순한 운송 상자와 달리, 제작 단계부터 국제기준에 따른 열처리와 훈증 공정을 거쳐 미생물과 해충의 유입을 차단하고, 물리적 충격뿐 아니라 급격한 온습도 변화로부터 작품을 보호하도록 설계되는 소규모 보존 시스템으로 기능한다. 뉴미디어 작품은 고정된 실체가 아닌 데이터와 가변적인 하드웨어로 존재한다. 비물질적인 데이터는 저장매체와 재생매체를 통해 보관되고 구현되는데, 기술 발전에 따라 레이저 디스크(Laser Disc)가 DVD로, DVD가 다시 디지털 파일로 이행하며 저장과 재생의 형식이 급격하게 변화해왔다. 이러한 매체의 전환은 기술 변화의 흐름 속에서 뉴미디어 작품의 원형을 어떻게 보존할 것인지에 대한 과제로 이어진다. 수장고는 작품이 전시되기 전 가장 내밀하게 보호받는 보존과 관리의 현장이다. 작품을 안전하게 보존하고 정확하게 구현하기 위한 미술관의 노력은 보이지 않는 곳에서 지속되고 있다. 이번 전시는 설치미술의 거대한 스케일을 응축한 크레이트와 비물질적 데이터를 보존하는 뉴미디어 수장 시스템을 통해 미술관 보존관리의 기능적 단면을 가시화하여 수장고 현장을 투명하게 공유한다. 해당 공연·전시 프로그램은 주최자·공연자 등의 사정에 따라 변경될 수 있습니다. 1688-2220\",\"discount\":\"$undefined\",\"originalPrice\":\"$undefined\",\"price\":\"무료\",\"gradeIcon\":\"$undefined\",\"ageRating\":\"\",\"subGenre\":\"$undefined\",\"runningTime\":\"$undefined\",\"originalTitle\":\"$undefined\",\"productionCountry\":\"$undefined\",\"productionYear\":\"$undefined\",\"cast\":[],\"director\":\"$undefined\",\"movieInfo\":\"$undefined\",\"homeTeam\":\"$undefined\",\"awayTeam\":\"$undefined\",\"homeTeamLogo\":\"$undefined\",\"awayTeamLogo\":\"$undefined\",\"backupPoster\":\"http://www.culture.go.kr/upload/ucms/oneCltInfo/2026/202602/ad18cf0a637e4b059ec687208c53b8a9.jpg\",\"posterUrl\":\"$undefined\",\"category\":\"$undefined\",\"rank\":\"$un 우는 작은 실험실로 설계된다. 아이들은 하루 동안 자신의 감정에 대응되는 ‘마음의 모양’을 만들어보고, 선·면·색·밀도의 조합으로 마음이 어떻게 달라지는지 시각적으로 익히게 된다. 해당 공연·전시 프로그램은 주최자·공연자 등의 사정에 따라 변경될 수 있습니다. 1688-2220\",\"discount\":\"$undefined\",\"originalPrice\":\"$undefined\",\"price\":\"무료\",\"gradeIcon\":\"$undefined\",\"ageRating\":\"\",\"subGenre\":\"$undefined\",\"runningTime\":\"$undefined\",\"originalTitle\":\"$undefined\",\"productionCountry\":\"$undefined\",\"productionYear\":\"$undefined\",\"cast\":[],\"director\":\"$undefined\",\"movieInfo\":\"$undefined\",\"homeTeam\":\"$undefined\",\"awayTeam\":\"$undefined\",\"homeTeamLogo\":\"$undefined\",\"awayTeamLogo\":\"$undefined\",\"backupPoster\":\"http://www.culture.go.kr/upload/ucms/oneCltInfo/2026/202602/c2eeb54d98ac477bb37b9d5d65d92d01.jpg\",\"posterUrl\":\"$undefined\",\"category\":\"$undefined\",\"rank\":\"$undefined\",\"dateRaw\":\"$undefined\",\"lat\":36.3668725417191,\"lng\":127.385713083518,\"address\":\"대전광역시 서구 둔산대로 155\",\"source\":\"culture-portal\",\"website\":\"$undefined\",\"parking\":\"$undefined\",\"parkingFee\":\"$undefined\",\"facilities\":\"\",\"restrooms\":\"$undefined\",\"performanceTime\":\"10:00 ~ 19:00 (매월 마지막 수요일 21:00 까지) *관람시간 종료 30분전까지\",\"bookingNotice\":\"$undefined\",\"ageDetail\":\"$undefined\",\"feesAndPrograms\":\"\",\"targetAudience\":\"\",\"operatingHours\":\"\",\"priceDetail\":\"\",\"closedDays\":\"\",\"contact\":\"042-270-7331\",\"synopsis\":\"$undefined\",\"trailer\":\"$undefined\",\"roi\":\"$undefined\",\"reservationRate\":\"$undefined\",\"audienceCount\":\"$undefined\",\"budget\":\"$undefined\",\"revenue\":\"$undefined\",\"budgetKRW\":\"$undefined\",\"revenueKRW\":\"$undefined\"},{\"id\":\"perf_내_모든_걸\",\"title\":\"내 모든 걸\",\"date\":\"2026.03.18 (수) ~ 2026.06.07 (일)\",\"venue\":\"대구 | 문화예술전용극장CT\",\"image\":\"http://www.culture.go.kr/upload/rdf/26/02/rdf_2026022721172210305.gif\",\"link\":\"https://www.mcst.go.kr/kor/s_culture/culture/cultureView.jsp?pSeq=66206\",\"region\":\"unknown\",\"genre\":\"exhibition\",\"description\
