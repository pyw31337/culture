ndefined\",\"facilities\":\"\",\"restrooms\":\"$undefined\",\"performanceTime\":\"금요일(19:00), 토요일(17:00), 일요일(16:00)\",\"bookingNotice\":\"$undefined\",\"ageDetail\":\"$undefined\",\"feesAndPrograms\":\"\",\"targetAudience\":\"\",\"operatingHours\":\"\",\"priceDetail\":\"\",\"closedDays\":\"\",\"contact\":\"\",\"synopsis\":\"$undefined\",\"trailer\":\"$undefined\",\"roi\":\"$undefined\",\"reservationRate\":\"$undefined\",\"audienceCount\":\"$undefined\",\"budget\":\"$undefined\",\"revenue\":\"$undefined\",\"budgetKRW\":\"$undefined\",\"revenueKRW\":\"$undefined\"},{\"id\":\"perf_UNDERCITY_presents_Jeremy_Olander_내한공연_제레미_올랜더_When_The_Rain_Falls_앨범_투어\",\"title\":\"UNDERCITY presents, Jeremy Olander 내한공연: 제레미 올랜더 When The Rain Falls 앨범 투어\",\"date\":\"2026.04.25 (토) ~ 2026.04.26 (일)\",\"venue\":\"언더시티 UNDER CITY) (언더시티 (B1)\",\"image\":\"http://www.kopis.or.kr/upload/pfmPoster/PF_PF286062_260303_114607.gif\",\"link\":\"https://www.kopis.or.kr/por/db/pblprfr/pblprfrView.do?menuId=MNU_00020\u0026mt20Id=PF286062\",\"region\":\"etc\",\"genre\":\"concert\",\"description\":\"[공연소개]\\n\\nUNDERCITY의 Soft Opening을 함께 열었던 Jeremy Olander가 1년 만에 다시 성수를 찾는다. 이번에는 단 한 번의 Set이 아닌, 밤의 시작부터 끝까지의 흐름을 하나의 서사로 완성하는 Open to Close ? All Night Long Set (6시간)으로 무대를 채운다.\\n\\nEric Prydz의 Pryda Friends를 통해 데뷔한 이후, Drumcode, Anjunadeep, Diynamic 등 세계적인 레이블을 넘나들며 그는 멜로딕 하우스와 테크노 신에서 가장 신뢰받는 프로듀서로 자리매김해왔다. 섬세한 사운드 디자인과 감정과 구조를 동시에 설계하는 셋 구성은 그의 가장 큰 시그니처다. 2014년 설립한 자신의 레이블 Vivrant를 통해 아티스트이자 큐레이터로서의 정체성도 확립해왔다.\\n\\n이번 공연은 단순한 내한 공연이 아닌, Vivrant Showcase이자 그의 데뷔 앨범 When The Rain Falls 시대를 여는 상징적인 밤이다. 오는 3월 13일 발매되는 이 앨범은, 수년간의 예술적 진화와 삶의 변화를 담아낸 그의 가장 개인적이고 성찰적인 작품이다.\\n\\nWhen The Rain Falls는 클럽을 위한 기능적 트랙이 아닌, ‘듣는 음악’으로서의 전자음악을 지향한다. 자신의 경험과 감정에 기반해 완성된 이 앨범은 Jeremy Olander가 새롭게 정의한 사운드의 방향성을 보여준다.\\n\\n첫 싱글 ‘Apollo’를 시작으로 펼쳐지는 앨범의 세계관은 시네마틱한 사운드와 선명한 감정선을 중심으로, 다양한 협업을 통해 확장된 그의 음악적 스펙트럼을 드러낸다. 기존 프로그레시브 하우스를 넘어, 보다 성숙하고 서사적인 사운드로 진화한 전환점이다.\\nUNDERCITY에서 펼쳐질 이번 Open to Close Set은 그의 커리어와 앨범 서사, 그리고 Vivrant의 철학이 하나로 연결되는 순간이다. 이 밤은 그의 음악과 함께 성장해온 팬들에게, 오랫동안 기억될 특별한 경험으로 남을 것이다.\",\"discount\":\"$undefined\",\"originalPrice\":\"$undefined\",\"price\":\"전석 37,000원\",\"gradeIcon\":\"$undefined\",\"ageRating\":\"만 19세 이상\",\"subGenre\":\"$undefined\",\"runningTime\":\"$undefined\",\"originalTitle\":\"$undefined\",\"productionCountry\":\"$undefined\",\"productionYear\":\"$undefined\",\"cast\":[\"제레미 올랜더\"],\"director\":\"$undefined\",\"movieInfo\":\"$undefined\",\"homeTeam\":\"$undefined\",\"awayTeam\":\"$undefined\",\"homeTeamLogo\":\"$undefined\",\"awayTeamLogo\":\"$undefined\",\"backupPoster\":\"http://www.kopis.or.kr/upload/pfmPoster/PF_PF286062_260303_114607.gif\",\"posterUrl\":\"$undefined\",\"category\":\"$undefined\",\"rank\":\"$undefined\",\"dateRaw\":\"$undefined\",\"lat\":37.5431486395019,\"lng\":127.063907544925,\"address\":\"서울 성동구 성수이로22길 61\",\"source\":\"kopis\",\"website\":\"$undefined\",\"parking\":\"$undefined\",\"parkingFee\":\"$undefined\",\"facilities\":\"\",\"restrooms\":\"$undefined\",\"performanceTime\":\"토요일(21:00)\",\"bookingNotice\":\"$undefined\",\"ageDetail\":\"만 19세 이상\",\"feesAndPrograms\":\"\",\"targetAudience\":\"\",\"operatingHours\":\"\",\"priceDetail\":\"\",\"closedDays\":\"\",\"contact\":\"\",\"synopsis\":\"[공연소개]\\n\\nUNDERCITY의 Soft Opening을 함께 열었던 Jeremy Olander가 1년 만에 다시 성수를 찾는다. 이번에는 단 한 번의 Set이 아닌, 밤의 시작부터 끝까지의 흐름을 하나의 서사로 완성하는 Open to Close ? All Night Long Set (6시간)으로 무대를 채운다.\\n\\nEric Prydz의 Pryda Friends를 통해 데뷔한 이후, Drumcode, Anjunadeep, Diynamic 등 세계적인 레이블을 넘나들며 그는 멜로딕 하우스와 테크노 신에서 가장 신뢰받는 프로듀서로 자리매김해왔다. 섬세한 사운드 디자인과 감정과 구조를 동시에 설계하는 셋 구성은 그의 가장 큰 시그니처다. 2014년 설립한 자신의 레이블 Vivrant를 통해 아티스트이자 큐레이터로서의 정체성도 확립해왔다.\\n\\n이번 공연은 단순한 내한 공연이 아닌, Vivrant Showcase이자 그의 데뷔 앨범 When The Rain Falls 시대를 여는 상징적인 밤이다. 오는 3월 13일 발매되는 이 앨범은, 수년간의 예술적 진화와 삶의 변화를 담아낸 그의 가장 개인적이고 성찰적인 작품이다.\\n\\nWhen The Rain Falls는 클럽을 위한 기능적 트랙이 아닌, ‘듣는 음악’으로서의 전자음악을 지향한다. 자신의 경험과 감정에 기반해 완성된 이 앨범은 Jeremy Olander가 새롭게 정의한 사운드의 방향성을 보여준다.\\n\\n첫 r/por/db/pblprfr/pblprfrView.do?menuId=MNU_00020\u0026mt20Id=PF289191\",\"region\":\"etc\",\"genre\":\"concert\",\"description\":\"[공연소개]\\n\\n\\n[문래재즈IN#연중특집］루크 길레스피(Luke Gillespie) 내한공연.\\n\\n \\n\\n미국의 재즈피아니스트로 활발히 활동 중인 루크 길레스피는 오랜 기간 재즈 명문 Indiana University의 교수로 재임하며 클래식 연주자로도 활동중이다. 길레스피는 1994년 Indianapolis Jazz Festival Competition, best performance from the Indianapolis Star in 1993에서 우승을 하였으며 베니 골슨, 크리스 포터, 아르투로 산도발, 존 패티투치 등 세계적인 재즈 뮤지션들과 연주활동을 하였다.\\n\\n \\n\\n스탠다드 재즈를 재조화하고 재창조하는데 천재적인 피아니스트라는 찬사와 함께 그의 연주는 철저하게 전통에 기반을 둔 드라마틱한 구성을 보여주며, 환상적인 피아노 테크닉과 다양하고 모던한 보이싱 등 환상적인 연주 선보이며 관객들의 갈채를 받아왔다. 올해로 세번째 내한공연으로 방한을 하는 그는 한국에서 연주공간으로 가장 애정하는 곳 중 하나인 문래재즈인을 찾아, 그가 극찬을 한 그랜드피아노 사운드로 관객들과 소통할 예정에 있다.\\n\\n \\n\\n이번 공연에 함께하는 한국 정상의 재즈뮤지션들로는, 한국의 첫 재즈 플룻 전공자이자이며 개척가로 미국의 명문 음대 Indiana University에서 Jazz Studies 석사를 마친 후 뉴욕에서 활동한 뒤 귀국하여 독보적인 활동중인 재즈플루티스트 윤혜진과, 미국 재즈명문 New School Jazz 출신의 명석한 색소포니스트 이경구, 제3회 자라섬국제콩쿨 대상 및 솔로이스트상 수상 출신의 명베이스 김인영, 네덜란드 왕립 음악원 출신으로 수려한 테크닉과 인터플레이로 그 실력을 인정받아 온 드러머 오상목이 함께하여 다시없을 감동의 무대를 선사할 예정이다.\",\"discount\":\"$undefined\",\"originalPrice\":\"$undefined\",\"price\":\"전석 30,000원\",\"gradeIcon\":\"$undefined\",\"ageRating\":\"\",\"subGenre\":\"$undefined\",\"runningTime\":\"$undefined\",\"originalTitle\":\"$undefined\",\"productionCountry\":\"$undefined\",\"productionYear\":\"$undefined\",\"cast\":[],\"director\":\"$undefined\",\"movieInfo\":\"$undefined\",\"homeTeam\":\"$undefined\",\"awayTeam\":\"$undefined\",\"homeTeamLogo\":\"$undefined\",\"awayTeamLogo\":\"$undefined\",\"backupPoster\":\"http://www.kopis.or.kr/upload/pfmPoster/PF_PF289191_260413_114251.gif\",\"posterUrl\":\"$undefined\",\"category\":\"$undefined\",\"rank\":\"$undefined\",\"dateRaw\":\"$undefined\",\"lat\":37.5161339,\"lng\":126.8906595,\"address\":\"서울특별시 영등포구 도림로 475 (문래동4가)\",\"source\":\"kopis\",\"website\":\"$undefined\",\"parking\":\"$undefined\",\"parkingFee\":\"$undefined\",\"facilities\":\"\",\"restrooms\":\"$undefined\",\"performanceTime\":\"토요일(19:00)\"  송파구 올림픽로 424\",\"source\":\"kopis\",\"website\":\"$undefined\",\"parking\":\"$undefined\",\"parkingFee\":\"$undefined\",\"facilities\":\"\",\"restrooms\":\"$undefined\",\"performanceTime\":\"금요일(19:00), 토요일(17:00), 일요일(16:00)\",\"bookingNotice\":\"$undefined\",\"ageDetail\":\"$undefined\",\"feesAndPrograms\":\"\",\"targetAudience\":\"\",\"operatingHours\":\"\",\"priceDetail\":\"\",\"closedDays\":\"\",\"contact\":\"\",\"synopsis\":\"$undefined\",\"trailer\":\"$undefined\",\"roi\":\"$undefined\",\"reservationRate\":\"$undefined\",\"audienceCount\":\"$undefined\",\"budget\":\"$undefined\",\"revenue\":\"$undefined\",\"budgetKRW\":\"$undefined\",\"revenueKRW\":\"$undefined\"},{\"id\":\"perf_나윤선의_Lost_Pieces_구례\",\"title\":\"나윤선의 Lost Pieces [구례]\",\"date\":\"2026.05.29 (금)\",\"venue\":\"천은사 [전남 구례]\",\"image\":\"http://www.kopis.or.kr/upload/pfmPoster/PF_PF289018_260409_133325.jpg\",\"link\":\"https://www.kopis.or.kr/por/db/pblprfr/pblprfrView.do?menuId=MNU_00020\u0026mt20Id=PF289018\",\"region\":\"etc\",\"genre\":\"concert\",\"description\":\"[공연소개]\\n\\n매년 나윤선은 변화무쌍하고 다채로운 음색과 독창적이고 독보적인 표현력으로 전 세계인의 사랑을 받고 있는 보컬리스트다.데뷔 후 30년 동안 나윤선은 Elles, Waking World, Immersion, Same Girl, Lento 등 총 12장의 정규음반을 발표하였으며, 한국인 최초로 프랑스 문화 예술훈장을 2회 수훈(슈발리에/오피시에) 한 것을 비롯, 골든디스크(프랑스), 에코 어워드(독일), 대한민국 대중음악상,세종문화상 등을 수상하며 예술적 성취와 영향력을 인정받아왔다.\\n\\n몬트리올(캐나다), 몽트뢰(스위스), 니스(프랑스), 노스 씨(네덜란드), 몬트레이(미국) 재즈 페스티벌 등 유수의 페스티벌 무대와 프랑스 샤틀레 극장, 뉴욕 UN 총회장에서 공연을 펼치는 등 연평균 약 100회의 공연을 이어가고 있다.\\n\\n나윤선의 최신 앨범 Lost Pieces는 인간 나윤선의 자기 발견과 자기 수용의 과정을 담아낸 작품이다. 나윤선은 이번 앨범에서 처음에는 다소 쓸쓸한 정서로 이야기를 시작하지만, 결국에는 스스로를 단단하게 마주하는 힘을 찾으며 앞으로 한 걸음 더 나아간다.이번 앨범에 수록된 11곡에서 나윤선은 사랑과 타인, 그리고 자기 자신에 대한 의구심을 섬세하게 풀어내는 동시에 상실과 이별, 관계의 균열과 회복의 순간들을 음악 안에서 자연스럽게 펼쳐 보인다.\\n\\n이번 앨범 역시 나윤선이 모든 곡을 직접 작사작곡했으며, 이 곡들은 인디 팝의 감수성과 자유로운 재즈 어법, 포크 특유의 울림을 유기적으로 엮어낸다. 나윤선은 이러한 장르의 경계를 자연스럽게 넘나들며 전체의 음악을 하나의 이야기로 만들며 높은 몰입감을 자아낸다.\\n\\n수많은 음악적 성취와 세계적인 활동을 이어온 나윤선의 커리어에서 Lost Pieces는 또 하나의 중요한 지점이 되는 작품이다. 그 어느 작품보다도 라이브 공연의 감정의 깊이와 관객과의 호흡이
