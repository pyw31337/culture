  </defs>

  <rect width="800" height="1200" fill="url(#bg)" rx="36" />
  <rect x="64" y="64" width="672" height="1072" rx="28" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />

  <g opacity="0.18">
    <circle cx="132" cy="132" r="18" fill="#fff" />
    <circle cx="668" cy="132" r="18" fill="#fff" />
