  <path d="M300 305h200c22 0 40 18 40 40v230c0 22-18 40-40 40H300c-22 0-40-18-40-40V345c0-22 18-40 40-40Z" fill="url(#panel)" />
  <path d="M340 345v230M460 345v230" stroke="rgba(17,24,39,0.35)" stroke-width="16" stroke-linecap="round" />
  <path d="M300 395h240M300 525h240" stroke="rgba(17,24,39,0.35)" stroke-width="16" stroke-linecap="round" />
  <circle cx="400" cy="460" r="76" fill="rgba(17,24,39,0.28)" />
  <polygon points="382,420 454,460 382,500" fill="#fff" />

  <text x="400" y="820" fill="#ffffff" font-family="Arial, sans-serif" font-size="72" font-weight="700" text-anchor="middle">MOVIE</text>
