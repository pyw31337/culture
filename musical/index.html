15:00)\",\"bookingNotice\":\"$undefined\",\"ageDetail\":\"$undefined\",\"feesAndPrograms\":\"\",\"targetAudience\":\"\",\"operatingHours\":\"\",\"priceDetail\":\"\",\"closedDays\":\"\",\"contact\":\"\",\"synopsis\":\"$undefined\",\"trailer\":\"$undefined\",\"roi\":\"$undefined\",\"reservationRate\":\"$undefined\",\"audienceCount\":\"$undefined\",\"budget\":\"$undefined\",\"revenue\":\"$undefined\",\"budgetKRW\":\"$undefined\",\"revenueKRW\":\"$undefined\"},{\"id\":\"perf_알사탕_공주\",\"title\":\"알사탕 [공주]\",\"date\":\"2026.05.05 (화)\",\"venue\":\"공주문예회관 대공연장\",\"image\":\"http://www.kopis.or.kr/upload/pfmPoster/PF_PF285398_260219_170851.gif\",\"link\":\"https://www.kopis.or.kr/por/db/pblprfr/pblprfrView.do?menuId=MNU_00020\u0026mt20Id=PF285398\",\"region\":\"etc\",\"genre\":\"musical\",\"description\":\"[공연소개]\\n\\n우리 아이에게 주는 최고의 선물! 뮤지컬 \u003c알사탕\u003e과 함께하는 '행복한 하루'\\n\\n5월 5일 어린이날, 공주문예회관이 아이들을 위해 거대한 꿈의 놀이터로 변신한다.\\n2025년부터 시작된 문예회관의 어린이날 특별 프로젝트가 올해는 더욱 업그레이드된 재미와 감동으로 가족 관객들을 맞이한다.\\n대공연장 무대에는 전 세계가 사랑한 백희나 작가의 베스트셀러 원작, 가족 뮤지컬 \u003c알사탕\u003e이 오른다. 신비한 사탕을 먹고 마음의\\n소리를 듣게 된 동동이의 이야기를 통해 서툴지만 진심 어린 가족의 사랑과 용기를 전하며 아이와 부모님 모두에게 뭉클한 따뜻함을\\n선사할 예정이다. 감동은 무대 밖에서도 계속된다. 공연 전후로 로비와 야외에서 다채로운 부대행사 \u003c행복한 하루\u003e가 펼쳐진다.\\n아기자기한 '작은 극장'과 흥겨운 '야외 퍼포먼스' 눈을 뗄 수 없는 '마술 공연'이 축제의 흥을 돋운다. 또한 아이들을 반겨줄 '키다리 아저씨' 등\\n체험 행사가 가득해 지루할 틈이 없다. 온 가족이 웃고 즐기며 소중한 추억을 만드는 어린이날 최고의 나들이 명소가 되기를 기대한다.\\n\\n\\n[작품소개]\\n\\n마음의 소리가 들리는 '마법의 알사탕'이 전하는 따뜻한 위로와 성장 이야기.\\n세계적인 작가 백희나의 그림책 \u003c알사탕\u003e을 원작으로 탄탄한 스토리에 아름다운 음악과\\n다양한 무대효과가 더해져 그림책의 감동을 그대로 구현한다.\\n2019년 초연 이후 3년 연속 판매랭킹 1위(놀 티켓 아동, 가족 부문)를 기록하며,\\n아이는 물론 부모의 마음까지 사로잡은 명품 가족 뮤지컬이다.\\n\\n\\n[시놉시스]\\n\\n\\\"그건 알사탕이야. 아주 달지.\\\"\\n \\n문방구에서 산 알사탕 한 봉지. 사탕 한 알을 입에 넣자\\n \\n원래는 들을 수 없던 소리가 들린다!\\n \\n\\\"동동아~ 동동아~\\\"\\n \\n마법의 사탕이 들려주는 마음의 소리!\\n \\n다음엔 또 누구의 소리가 들릴까?\",\"discount\":\"$undefined\",\"originalPrice\":\"$undefined\",\"price\":\"R석 30,000원\\nS석 20,000원\\nA석 10,000원\",\"gradeIcon\":\"$undefined\",\"ageRating\":\"36개월 이상\",\"
